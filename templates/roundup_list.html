{% extends "base.html" %}
{% block title %}まとめ記事 | {{ site.title }}{% endblock %}
{% block canonical %}{{ site_root }}/roundups/{% endblock %}
{% block content %}
<h1>まとめ記事</h1>
<ul class="roundup-list">
  {% for r in roundups %}
  <li><a href="{{ base }}{{ r.path }}">{{ r.title }}</a><span class="meta">{{ r.count }}点 / {{ r.updated }}</span></li>
  {% endfor %}
</ul>
{% endblock %}
