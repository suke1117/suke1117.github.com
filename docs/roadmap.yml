  - id: P2x
    title: 予想を予想屋が渡せる形にする
    category: market
    priority: P1
    effort: S
    status: done
    impact: 製品として使えるか
    why: >-
      予想ページは特徴量名と寄与度を並べていた。これは診断であって予想ではない。
      買い目を人に渡すには、どの馬を、いくらで、なぜ買うのかが文章になっている必要がある。
      一方で文章は数字と違って嘘をつけるので、言い換えの範囲を超えた表現を入れない仕組みが要る。
    done: >-
      src/live/narrative.py が説明レイヤの値だけから日本語の根拠文とコピー可能な買い目ブロックを作り、
      予想ページがそれを表示する。全フレーズが測定値の言い換えであること、
      不利材料も同じ構造で書かれること、見送りにも理由が付くことをテストで固定する。
    result: >-
      実装済み。1 フレーズ = 1 特徴量の言い換えとし、断定語 (鉄板・確実など) が語彙に入らないことをテストで固定した。
      自信度 (主力 / 対抗 / 押さえ) はケリー配分の**その日の最大値に対する比**で決める。
      絶対値での格付けは実世界のエッジについての主張になり、合成データでは裏付けが無いため。
      画面側は「本日の主力」バナー、絞り込み (購入のみ / 主力のみ / 見送り)、並び替え (開催順 / 期待値順 / 配分順)、
      競馬場での絞り込み、j/k/c/f のキー操作、レース単位と日単位のコピーを追加した。
      作業中に 2 つのバグが出た: レースの格付けを 3 つの日本語文字列の max で取っていたが、
      主力 / 対抗 / 押さえ はコードポイント順では強さ順にならない。
      もう 1 つは購入票で、馬連が "H1+H2" の 1 つの id で保存されるため単走馬との突合が外れ、
      馬連だけを買ったレースが「購入なし」として集計されていた。
    files: [src/live/narrative.py, src/live/explain.py, web/index.html, tests/test_narrative.py]

