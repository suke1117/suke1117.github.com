  - id: C2
    title: 2 着・3 着確率の Henery 補正
    category: probability
    priority: P2
    effort: M
    status: done
    impact: 複数券種の較正誤差
    why: >-
      Plackett-Luce (Harville 型) は 1 着確率から 2 着・3 着を導くとき、
      強い馬の連対率を系統的に過大評価することが知られている。
      べき乗ディスカウント (Stern / Henery 型) を導入し、実測の着順分布でパラメータをフィットする。
      複勝・馬連・3 連単に手を広げる前の必須条件。
    done: 2 着・3 着の予測分布が実測と一致し、複勝確率の ECE が現在の Harville 版より改善する。
    result: >-
      実装済み。Stern / Henery 型のべき乗ディスカウントを Plackett-Luce に入れ、較正スライスで λ と μ を最尤推定する。λ=1 は従来の Harville と厳密に一致するため既存の値は変わらない。生成側に λ=0.65 の走り方を入れたデータで、推定値は λ=0.69 / μ=0.66 と回収できた。
    files: [src/models/plackett_luce.py]

