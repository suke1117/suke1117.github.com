  - id: V2
    title: 投入額加重と 1 点等重みの回収率を分けて報告する
    category: validation
    priority: P0
    effort: S
    status: done
    impact: 測定精度
    why: >-
      複利で賭けていると後半のベットほど金額が大きく、当たりが後半に偏っただけで加重回収率が上振れする。
      実測では加重 116.4% に対し等重み 108.1% で、8 ポイントの差が意思決定の質とは無関係に出ている。
      施策の評価には等重みのほうが適切で、資金曲線の評価には加重が適切なので、両方を併記する。
    done: summary.json が両方を持ち、ダッシュボードが並べて表示する。
    result: >-
      実装済み。投入額加重と 1 点等重みの回収率を両方出す。複利下では前者が後半のベットに引きずられるため、施策の比較には後者を見る。t 値と、15 ポイントのエッジを検出するのに必要な点数も併記する。
    files: [src/backtest/metrics.py]

  - id: V3
    title: パラメータ探索の選択バイアスを定量化する
    category: validation
    priority: P0
    effort: M
    status: done
    impact: 測定精度
    why: >-
      108 点のグリッドから最良を選べば、探索期間の成績は定義上必ず上振れする。
      現在は探索とホールドアウトの差 (-24.9 ポイント) を表示するだけで、
      そのうちどれだけが選択バイアスで、どれだけが本物の劣化かを分離していない。
      これが分からないと、ハイパーパラメータ探索に進んだ瞬間に嘘が増える。
    done: >-
      着順をシャッフルしたデータで同じ探索を回し、エッジがゼロのときにグリッド最良値が
      どれだけ上振れするかを測る。その期待上振れ幅を sweep の出力に含める。
    result: >-
      実装済み。同じグリッドを「市場がちょうど正しい」ヌル世界でも回す。着順を市場のインプライド確率から引き直すため、どの買い方をしても期待値は 1-控除率 に固定される。そこでの最良点とグリッド平均の差が探索そのものが作る上振れで、探索期間の成績から差し引いて報告する。実装当初は基準を 100% に置いており、控除率のぶんを上振れと取り違えて符号ごと誤った値を出していた。無エッジの期待値は 1-控除率 であって break-even ではない。
    depends: [V1]
    files: [src/backtest/sweep.py]

  - id: V4
    title: アブレーションを複数ウィンドウのウォークフォワードにする
    category: validation
    priority: P0
    effort: M
    status: done
    impact: 測定精度
    why: >-
      `src/models/ablation.py` は現在 1 つのホールドアウト期間でしか測っていない。
      P1 の特徴量タスクはすべて「対数損失が改善する」を完了条件にしているため、
      その測定自体が 1 ウィンドウだと、ウィンドウを引き直せば結論が変わる余地が残る。
      シード平均は入れてあるがウィンドウ平均が無い。
    done: >-
      アブレーションが複数の再学習ウィンドウで寄与を測り、ウィンドウ間のばらつきも出力する。
      ばらつきより小さい寄与は「判定不能」と表示する。
    result: >-
      実装済み。アブレーションが複数のウォークフォワード・ウィンドウで寄与を測り、シード分散とウィンドウ分散を分けて出す。有意と判定するのは、平均がウィンドウ分散の 2 倍を超え、かつ全ウィンドウで符号が揃うときだけ。1 ウィンドウでは判定そのものを出さない。これにより pair+switch の寄与は 3 ウィンドウで「判定不能」となり、単一ウィンドウの結論が決定的でなかったことが確認できた。
    depends: [V1]
    files: [src/models/ablation.py]

