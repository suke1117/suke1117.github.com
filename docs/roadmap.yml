  - id: X2
    title: 地方競馬 (NAR) の取り込み
    category: data
    priority: P1
    effort: M
    status: done
    impact: 週次リターン
    why: >-
      1 点あたりのエッジを上げるのは難しいが、賭けられる回数を増やすのは構造の問題で解ける。
      複利は対数で足し算になるため、週次リターンの天井は「1 点あたりの成長 × 週あたりの点数」で決まる。
      JRA は週 2 開催日しかない。地方競馬はほぼ毎日開催しており、取り込めば週あたりの点数が 3 倍前後になる。
      現在のエッジで 4 倍に必要な 292 点は、JRA だけなら約 4 週、地方を含めれば約 1.5 週に縮む。
      エッジを 3.8 倍にするより、開催日を 3 倍にするほうがはるかに現実的。
    done: >-
      地方競馬のデータソースが実装され、Phase 1〜4b が JRA と地方の混合データで通る。
      競馬場ごとの傾向差 (小回り、砂質、逃げ有利) が条件別特徴量で表現できていることを確認する。
    result: >-
      実装済み。地方競馬プリセット (平日開催・ダート中心・小頭数・独自の競馬場コードとクラス体系・控除率 25%) を生成器に追加し、CombinedSource が JRA と結合する。race_id の衝突と同日二重出走を結合時に検査する。organizer は複数組織が混在するときだけ特徴量に加わる。
    depends: [D1]
    files: [src/data/sources/, src/common/sport.py]

