  intro: >-
    週次リターンの天井は「1 点あたりの期待対数成長 × 週あたりの点数」で決まる。
    前者を上げるのが P0〜P2、後者を上げるのが X2。短期で倍率を求めて賭け金を上げるのは
    どちらでもなく、分散を買う行為で、中央値を下げながら破産確率だけを上げる。
    精度を上げる前に、精度が上がったと言えるだけの測定精度を確保する。
    現在の回収率の信頼区間は幅が 20 ポイント以上あり、数ポイントの改善は区別できない。
    この順序は「測定 → 特徴量 → モデル → 市場」で、上から順に、下流の施策の効果を判定できる状態を作っていく。

# 順序の根拠となる実測値。2022-01-01〜2023-12-31 の合成データ、α=0.1 / EV≥1.05 の設定で測定。
evidence:
  - label: "回収率 (投入額加重)"
    value: "116.4%"
    detail: "日単位ブロック・ブートストラップの 95% 区間は [103.9%, 128.8%]。幅が ±12 ポイントある。"
  - label: "回収率 (1点等重み)"
    value: "108.1%"
    detail: "t = 1.69 で 95% 有意に届かない。加重値との 8 ポイント差はエッジではなく複利の分布効果。"
  - label: "ホールドアウトの標準誤差"
    value: "約 14 ポイント"
    detail: "974 点・1点あたり収益の標準偏差 4.44 から算出。115.4% は単独では 100% と区別できない。"
  - label: "モデル単体の予測 1 位的中率"
    value: "30.4%"
    detail: >-
      条件別特徴量の投入前は 29.2% で 1 番人気 (29.8%) に負けていた。現在は 1 番人気と同水準。
  - label: "開催日数 (JRA + 地方競馬)"
    value: "624 → 2,145 日"
    detail: >-
      同じ 6 年間で開催日が 3.4 倍になる。週次リターンの天井は 1 点あたりの成長 × 週あたりの点数なので、
      ここは構造で解ける唯一の部分であり、モデルの出来に依存しない。
  - label: "合成データ上のエッジについて"
    value: "循環している"
    detail: >-
      複勝・馬連の回収率が高く出るのは、生成器で「大衆は Harville で複数券種を値付けするが、
      レースは λ=0.65 で走り下る」と定義したうえで、その歪みを直すモデルを当てているため。
      実装が正しいことの確認にはなるが、実際の JRA・地方のプールに同じ大きさの歪みがある保証は無い。
  - label: "1 週間 (JRA 2 開催日) の到達点"
    value: "フルケリーで 1.43 倍"
    detail: >-
      実測ベットの再標本化による。4 倍にするには 292 点 = 8 開催日が必要で、JRA だけでは約 4 週かかる。
      2 倍ケリーまで踏み込むと 1 週間で 4 倍になる確率は 14.3% だが、中央値は 0.72 倍、元本割れ確率は 58.4%。
      短期の高倍率は、エッジではなく分散から取りに行く行為になる。
  - label: "条件別特徴量の寄与"
    value: "対数損失 -0.089"
    detail: >-
      馬・騎手の条件別集計と相性・乗り替わりを外すと 2.065 から 2.154 に悪化する。
      シードによるばらつきは ±0.003 なので、差は実装由来。ただし合成データ側にその構造を入れた上での測定。

