<title>EquineAlpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;600;700&display=swap">
<style>
:root{
  --plane:#eaeef3; --surface:#ffffff; --surface-2:#f5f8fa; --surface-3:#eef2f6;
  --ink:#0d1117; --ink-2:#4a5563; --muted:#78838f;
  --grid:#e3e8ee; --axis:#c3ccd6; --border:rgba(13,17,23,.11);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --good-ink:#006300; --critical-ink:#b02a2a;
  --shadow:0 1px 1px rgba(13,17,23,.04), 0 10px 30px -22px rgba(13,17,23,.45);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plane:#0a0e13; --surface:#151b22; --surface-2:#1b222a; --surface-3:#212a33;
    --ink:#f2f5f8; --ink-2:#b4bec9; --muted:#7d8896;
    --grid:#232c36; --axis:#333e4a; --border:rgba(255,255,255,.12);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --good-ink:#0ca30c; --critical-ink:#e06a6a;
    --shadow:0 1px 1px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --plane:#0a0e13; --surface:#151b22; --surface-2:#1b222a; --surface-3:#212a33;
  --ink:#f2f5f8; --ink-2:#b4bec9; --muted:#7d8896;
  --grid:#232c36; --axis:#333e4a; --border:rgba(255,255,255,.12);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --good-ink:#0ca30c; --critical-ink:#e06a6a;
  --shadow:0 1px 1px rgba(0,0,0,.4), 0 12px 32px -20px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:"IBM Plex Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1180px; margin:0 auto; padding-inline:16px; padding-block:0 56px}
a{color:var(--s1)}
h1,h2,h3{text-wrap:balance; margin:0}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.tnum{font-variant-numeric:tabular-nums}

/* app bar + drawer */
.appbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; display:flex; align-items:center; gap:12px;
  background:var(--surface); border-bottom:1px solid var(--border); margin-inline:-16px; padding:10px 16px}
.appbar .name{font-size:14px; font-weight:600; letter-spacing:.01em; white-space:nowrap}
.appbar .sep{width:1px; height:16px; background:var(--border)}
.appbar .page{font-size:13px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.appbar .spacer{margin-left:auto}
.iconbtn{display:inline-flex; align-items:center; justify-content:center; width:36px; height:36px; flex:none;
  border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:9px; cursor:pointer; padding:0}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn:focus-visible{outline:2px solid var(--s1); outline-offset:2px}
.backdrop{position:fixed; inset:0; background:rgba(8,12,16,.42); z-index:40; opacity:0; pointer-events:none;
  transition:opacity .16s}
.backdrop.open{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; bottom:0; left:0; width:272px; max-width:86vw; z-index:41; background:var(--surface);
  border-right:1px solid var(--border); transform:translateX(-100%); transition:transform .18s ease;
  display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px)}
.drawer.open{transform:none}
.drawer .head{padding:16px 18px 12px; border-bottom:1px solid var(--border)}
.drawer .head .t{font-size:15px; font-weight:600}
.drawer .head .s{font-size:11.5px; color:var(--muted); margin-top:2px}
.drawer nav{padding:10px; display:flex; flex-direction:column; gap:2px; overflow-y:auto}
.navitem{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:8px; border:none;
  background:none; color:var(--ink-2); font:inherit; font-size:13.5px; text-align:left; cursor:pointer; width:100%}
.navitem:hover{background:var(--surface-2)}
.navitem[aria-current="page"]{background:var(--surface-3); color:var(--ink); font-weight:600}
.navitem .ic{width:18px; height:18px; flex:none; color:var(--muted)}
.navitem[aria-current="page"] .ic{color:var(--s1)}
.navitem .cnt{margin-left:auto; font-size:11px; color:var(--muted); font-variant-numeric:tabular-nums}
.navitem:focus-visible{outline:2px solid var(--s1); outline-offset:-2px}
.drawer .foot{margin-top:auto; padding:12px 18px; border-top:1px solid var(--border); font-size:11px; color:var(--muted)}
.page-body{padding-top:22px}
.page-body[hidden]{display:none !important}
.pagehead{margin-bottom:18px}
.pagehead h1{font-size:22px; font-weight:600; letter-spacing:-.01em}
.pagehead p{margin:5px 0 0; font-size:13px; color:var(--ink-2); max-width:70ch}

/* live page */
.live-state{display:flex; gap:12px; align-items:flex-start; border:1px solid var(--border); border-radius:var(--r);
  background:var(--surface); padding:16px 18px; margin-bottom:18px; border-left:3px solid var(--s1)}
.live-state.warn{border-left-color:var(--warn)}
.live-state p{margin:0 0 8px; font-size:13px; color:var(--ink-2)}
.live-state pre{margin:0; background:var(--surface-2); border:1px solid var(--border); border-radius:8px;
  padding:10px 12px; overflow-x:auto; font-family:"IBM Plex Mono",monospace; font-size:11.5px; line-height:1.8;
  color:var(--ink-2)}
.dot-live{width:8px; height:8px; border-radius:99px; background:var(--good); flex:none; margin-top:6px}
.dot-live.off{background:var(--muted)}
.race-card{border:1px solid var(--border); border-radius:8px; margin-bottom:10px; background:var(--surface-2);
  overflow:hidden}
.race-card > summary{cursor:pointer; padding:10px 14px; display:flex; gap:10px; align-items:center;
  font-size:12.5px; list-style:none}
.race-card > summary::-webkit-details-marker{display:none}
.race-card > summary:hover{background:var(--surface-3)}
.race-card .rno{font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--ink)}
.race-card .cond{color:var(--muted); font-size:11.5px}
.race-card .flag{margin-left:auto; font-size:11px; font-weight:600; color:var(--s1)}
.race-card .flag.none{color:var(--muted); font-weight:400}
.race-card .inner{padding:0 14px 12px}
tr.picked td{background:color-mix(in srgb, var(--s1) 9%, transparent)}
tr.picked td:first-child{font-weight:600}

/* header */
header{padding-block:28px 18px; display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end; justify-content:space-between}
header > .brand:last-child{align-items:flex-start; gap:10px}
.brand{display:flex; flex-direction:column; gap:4px}
.eyebrow{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:600}
h1{font-size:26px; font-weight:600; letter-spacing:-.01em}
.sub{color:var(--ink-2); font-size:13px; max-width:62ch}
.meta{display:flex; gap:18px; flex-wrap:wrap; font-size:12px; color:var(--muted)}
.meta b{color:var(--ink-2); font-weight:500}
button.theme{
  align-self:flex-start; width:fit-content;
  border:1px solid var(--border); background:var(--surface); color:var(--ink-2);
  border-radius:99px; padding:6px 14px; font:inherit; font-size:12px; cursor:pointer;
}
button.theme:hover{background:var(--surface-2)}
button.theme:focus-visible{outline:2px solid var(--s1); outline-offset:2px}

/* synthetic-data notice: the most important sentence on the page */
.notice{
  display:flex; gap:12px; align-items:flex-start;
  border:1px solid var(--border); border-left:3px solid var(--warn);
  background:var(--surface); border-radius:var(--r); padding:14px 16px; margin-bottom:22px;
}
.notice .ic{flex:none; width:18px; height:18px; margin-top:2px}
.notice p{margin:0; font-size:13px; color:var(--ink-2)}
.notice strong{color:var(--ink); font-weight:600}

/* KPI */
.kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; background:var(--border);
  border:1px solid var(--border); border-radius:var(--r); overflow:hidden; margin-bottom:26px}
.kpi{background:var(--surface); padding:16px 18px; display:flex; flex-direction:column; gap:2px; min-width:0}
.kpi.hero{grid-column:span 2}
.kpi .lab{font-size:11.5px; color:var(--muted); font-weight:500; letter-spacing:.01em}
.kpi .val{font-size:26px; font-weight:600; letter-spacing:-.02em; line-height:1.25}
.kpi.hero .val{font-size:50px; line-height:1.1; letter-spacing:-.03em}
.kpi .note{font-size:11.5px; color:var(--ink-2)}
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:2px 8px;
  border-radius:99px; border:1px solid var(--border); width:fit-content}
.pill .dot{width:7px; height:7px; border-radius:99px; flex:none}
.pill.good{color:var(--good-ink)} .pill.good .dot{background:var(--good)}
.pill.warn{color:var(--ink-2)} .pill.warn .dot{background:var(--warn)}
.pill.bad{color:var(--critical-ink)} .pill.bad .dot{background:var(--critical)}

/* cards */
.card{background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:18px 18px 14px; margin-bottom:18px; box-shadow:var(--shadow)}
.card > h2{font-size:15px; font-weight:600; letter-spacing:.01em}
.card > .desc{font-size:12.5px; color:var(--ink-2); margin:4px 0 14px; max-width:78ch}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:18px}
.row3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
@media(max-width:820px){ .row2,.row3{grid-template-columns:1fr} .kpis{grid-template-columns:repeat(2,1fr)} .rules.six{grid-template-columns:repeat(2,1fr)} }
@media(max-width:460px){ .kpi.hero .val{font-size:40px} }
.mini h3{font-size:12.5px; font-weight:600; color:var(--ink-2)}
.mini .unit{font-size:11px; color:var(--muted); margin-bottom:6px}

/* legend */
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-2); margin-bottom:8px}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{width:14px; height:3px; border-radius:2px; display:inline-block}
.legend i.sq{width:10px; height:10px; border-radius:3px}

/* chart host */
.chart{position:relative; width:100%}
.chart svg{display:block; width:100%; height:auto; overflow:visible}
.tip{
  position:absolute; pointer-events:none; opacity:0; transform:translate(-50%,-120%);
  background:var(--surface); color:var(--ink); border:1px solid var(--border); border-radius:8px;
  padding:7px 10px; font-size:12px; white-space:nowrap; box-shadow:var(--shadow); z-index:5; transition:opacity .09s;
}
.tip b{font-weight:600}
.tip .k{color:var(--muted); margin-right:6px}

/* tables */
.tw{overflow-x:auto; margin:0 -18px; padding:0 18px}
table{border-collapse:collapse; width:100%; font-size:12.5px; min-width:520px}
th,td{padding:8px 10px; text-align:right; border-bottom:1px solid var(--grid); white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{font-size:11px; font-weight:600; color:var(--muted); border-bottom:1px solid var(--axis); position:sticky; top:0; background:var(--surface)}
tbody tr:hover{background:var(--surface-2)}
tbody tr.sel{background:color-mix(in srgb, var(--s1) 8%, var(--surface))}
td.num{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.bar-cell{position:relative}
.bar-cell .fill{position:absolute; left:0; top:50%; transform:translateY(-50%); height:16px; border-radius:3px; opacity:.16}
.bar-cell span{position:relative}
caption{caption-side:bottom; text-align:left; font-size:11.5px; color:var(--muted); padding-top:10px}

/* compare block */
.cmp{display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:1px; background:var(--border); border:1px solid var(--border); border-radius:var(--r); overflow:hidden}
.cmp > div{background:var(--surface); padding:10px 14px; font-size:12.5px}
.cmp .hd{background:var(--surface-3); font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.02em}
.cmp .v{text-align:right; font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
.verdict{margin-top:12px; font-size:12.5px; color:var(--ink-2); border-left:3px solid var(--serious); padding:6px 0 6px 12px}

/* roadmap board */
.rm-intro{font-size:12.5px; color:var(--ink-2); margin:4px 0 14px; max-width:78ch}
.ev{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:1px; background:var(--border);
  border:1px solid var(--border); border-radius:8px; overflow:hidden; margin-bottom:16px}
.ev > div{background:var(--surface-2); padding:11px 13px}
.ev .k{font-size:11px; color:var(--muted); font-weight:500}
.ev .v{font-family:"IBM Plex Mono",monospace; font-size:17px; font-weight:600; letter-spacing:-.01em}
.ev .d{font-size:11.5px; color:var(--ink-2); margin-top:3px}
.filters{display:flex; gap:7px; flex-wrap:wrap; align-items:center; margin-bottom:16px; padding-bottom:13px;
  border-bottom:1px solid var(--grid)}
.filters .lbl{font-size:11px; color:var(--muted); font-weight:600; margin-right:2px}
.filters .sep{flex-basis:100%; height:0}
.chip{border:1px solid var(--border); background:var(--surface); color:var(--ink-2); border-radius:99px;
  padding:4px 11px; font:inherit; font-size:11.5px; cursor:pointer; line-height:1.4}
.chip:hover{background:var(--surface-3)}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--s1); outline-offset:2px}
.pgroup{margin-bottom:20px}
.pgroup:last-child{margin-bottom:4px}
.pghead{display:flex; align-items:baseline; gap:10px; margin-bottom:9px}
.pghead .tag-p{font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; color:var(--surface);
  background:var(--pc); border-radius:5px; padding:1px 7px}
.pghead h3{font-size:13.5px; font-weight:600}
.pghead .n{font-size:11.5px; color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums}
.tasks{display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:12px}
.task{border:1px solid var(--border); border-left:3px solid var(--pc); border-radius:8px; padding:12px 14px;
  background:var(--surface-2); display:flex; flex-direction:column}
.task .top{display:flex; gap:8px; align-items:baseline}
.task .tid{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); flex:none}
.task h4{font-size:13px; font-weight:600; margin:0; line-height:1.5}
.task .tags{display:flex; gap:5px; flex-wrap:wrap; margin:8px 0 9px}
.tag{font-size:10.5px; border:1px solid var(--border); border-radius:4px; padding:1px 6px; color:var(--ink-2);
  background:var(--surface); white-space:nowrap}
.tag.blocked{border-color:var(--critical); color:var(--critical-ink)}
.task p{margin:0; font-size:12px; color:var(--ink-2); line-height:1.7}
.task .dod{margin-top:auto; padding-top:9px; font-size:11.5px; color:var(--ink-2)}
.task.is-done{background:var(--surface); border-left-color:var(--good)}
.task.is-done h4{color:var(--ink-2)}
.task .res{margin-top:9px; padding-top:9px; border-top:1px solid var(--grid); font-size:11.5px; color:var(--ink-2)}
.task .res .h{display:block; font-size:10.5px; font-weight:600; color:var(--good-ink); letter-spacing:.03em;
  margin-bottom:2px}
.task .dod .h{display:block; font-size:10.5px; font-weight:600; color:var(--muted); letter-spacing:.03em; margin-top:9px;
  padding-top:9px; border-top:1px solid var(--grid)}
.rm-empty{padding:26px 0; text-align:center; color:var(--muted); font-size:12.5px}

/* diverging bar inside a table cell */
.dv{display:inline-block; position:relative; width:170px; height:18px; vertical-align:middle}
.dv .mid{position:absolute; left:50%; top:0; bottom:0; width:1px; background:var(--axis)}
.dv .b{position:absolute; top:3px; height:12px; border-radius:3px}
.dv .t{position:absolute; top:0; font-size:11px; line-height:18px; font-family:"IBM Plex Mono",monospace;
  color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap}

/* rules / footer */
.rules{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px}
.rules.six{grid-template-columns:repeat(3,1fr)}
.rule{border:1px solid var(--border); border-radius:8px; padding:11px 13px; background:var(--surface-2)}
.rule .k{font-size:11px; color:var(--muted); font-weight:500}
.rule .v{font-family:"IBM Plex Mono",monospace; font-size:15px; font-weight:500}
.rule .d{font-size:11.5px; color:var(--ink-2); margin-top:3px}
footer{margin-top:30px; padding-top:18px; border-top:1px solid var(--border); color:var(--muted); font-size:12px}
footer pre{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:12px 14px;
  overflow-x:auto; font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-2); line-height:1.8}
.loading{padding:60px 0; text-align:center; color:var(--muted)}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }
</style>

</div>
<div class="backdrop" id="backdrop" hidden></div>

 で走り下る」と定義したうえで、その歪みを直すモデルを当てているため。実装が正しいことの確認にはなるが、実際の JRA・地方のプールに同じ大きさの歪みがある保証は無い。"},{"label":"1 週間 (JRA 2 開催日) の到達点","value":"フルケリーで 1.43 倍","detail":"実測ベットの再標本化による。4 倍にするには 292 点 = 8 開催日が必要で、JRA だけでは約 4 週かかる。 2 倍ケリーまで踏み込むと 1 週間で 4 倍になる確率は 14.3% だが、中央値は 0.72 倍、元本割れ確率は 58.4%。短期の高倍率は、エッジではなく分散から取りに行く行為になる。"},{"label":"条件別特徴量の寄与","value":"対数損失 -0.089","detail":"馬・騎手の条件別集計と相性・乗り替わりを外すと 2.065 から 2.154 に悪化する。シードによるばらつきは±0.003 なので、差は実装由来。ただし合成データ側にその構造を入れた上での測定。"}],"tasks":[{"id":"D1","title":"実データを投入してベースラインを測り直す","category":"data","priority":"P0","effort":"L","status":"blocked","blocked_by":"JRA-VAN Data Lab. の契約と、JV-Link を動かす Windows 環境","impact":"全指標","why":"現在の数値はすべて合成データ。合成の潜在構造は特徴量が復元できるように作ってあるため、エッジの大きさ自体に意味はない。実データでの較正誤差・回収率・ドローダウンだけが基準線になる。特徴量を増やす作業は、実データが入ってからでないと効果を測れない。","done":"JRA-VAN の CSV で Phase 1〜4b が通り、合成データとの差分 (的中率、較正誤差、回収率) が docs に記録される。","files":["raw_data/","src/data/sources/jravan_csv.py"]},{"id":"V1","title":"回収率とシャープの信頼区間をブロック・ブートストラップで出す","category":"validation","priority":"P0","effort":"S","status":"done","impact":"測定精度","why":"現在は点推定しか出しておらず、施策の前後で回収率が 3 ポイント動いても、それが改善なのか偶然なのか判定できない。同一レース内のベットは排反事象で相関するため、 1 点単位ではなく開催日単位のブロックで再標本化する必要がある。","done":"metrics.py が回収率・シャープ・ドローダウンの 95% 区間を返し、ダッシュボードが区間付きで表示する。区間が 100% をまたぐ場合はその旨を明示する。","result":"実装済み。開催日単位のブロック・ブートストラップで回収率・1点等重み回収率の 95% 区間と、損益分岐を下回る確率を出力する。バックテストの表示とダッシュボードに区間が入り、95% で有意かどうかを明示するようになった。","files":["src/backtest/metrics.py","src/web/export_dashboard.py","web/index.html"]},{"id":"V2","title":"投入額加重と 1 点等重みの回収率を分けて報告する","category":"validation","priority":"P0","effort":"S","status":"done","impact":"測定精度","why":"複利で賭けていると後半のベットほど金額が大きく、当たりが後半に偏っただけで加重回収率が上振れする。実測では加重 116.4% に対し等重み 108.1% で、8 ポイントの差が意思決定の質とは無関係に出ている。施策の評価には等重みのほうが適切で、資金曲線の評価には加重が適切なので、両方を併記する。","done":"summary.json が両方を持ち、ダッシュボードが並べて表示する。","result":"実装済み。投入額加重と 1 点等重みの回収率を両方出す。複利下では前者が後半のベットに引きずられるため、施策の比較には後者を見る。t 値と、15 ポイントのエッジを検出するのに必要な点数も併記する。","files":["src/backtest/metrics.py"]},{"id":"V3","title":"パラメータ探索の選択バイアスを定量化する","category":"validation","priority":"P0","effort":"M","status":"todo","impact":"測定精度","why":"108 点のグリッドから最良を選べば、探索期間の成績は定義上必ず上振れする。現在は探索とホールドアウトの差 (-24.9 ポイント) を表示するだけで、そのうちどれだけが選択バイアスで、どれだけが本物の劣化かを分離していない。これが分からないと、ハイパーパラメータ探索に進んだ瞬間に嘘が増える。","done":"着順をシャッフルしたデータで同じ探索を回し、エッジがゼロのときにグリッド最良値がどれだけ上振れするかを測る。その期待上振れ幅を sweep の出力に含める。","depends":["V1"],"files":["src/backtest/sweep.py"]},{"id":"V4","title":"アブレーションを複数ウィンドウのウォークフォワードにする","category":"validation","priority":"P0","effort":"M","status":"todo","impact":"測定精度","why":"`src/models/ablation.py` は現在 1 つのホールドアウト期間でしか測っていない。 P1 の特徴量タスクはすべて「対数損失が改善する」を完了条件にしているため、その測定自体が 1 ウィンドウだと、ウィンドウを引き直せば結論が変わる余地が残る。シード平均は入れてあるがウィンドウ平均が無い。","done":"アブレーションが複数の再学習ウィンドウで寄与を測り、ウィンドウ間のばらつきも出力する。ばらつきより小さい寄与は「判定不能」と表示する。","depends":["V1"],"files":["src/models/ablation.py"]},{"id":"F1","title":"ペースと展開を推定する特徴量","category":"features","priority":"P1","effort":"L","status":"todo","impact":"対数損失","why":"日本の競馬予想で最重要とされる因子が、現在は完全に欠落している。通過順位 (JV-Data SE の corner 情報) から各馬の脚質を推定し、出走馬の構成から想定ペースを作る。逃げ馬が多いレースでは先行勢が総崩れするといった相互作用は、個体能力の集計だけでは表現できない。現在のモデルが 1 番人気に勝てていない理由の相当部分がここにあると見ている。","done":"各馬の脚質分布 (as-of)、レースの想定ペース指標、脚質×想定ペースの交互作用が特徴量に入り、ホールドアウトの対数損失が改善する。","depends":["D1","V1"],"files":["src/data/features.py","src/data/sources/jravan_csv.py"]},{"id":"F2","title":"馬場差を推定して絶対スピード指数に変換する","category":"features","priority":"P1","effort":"M","status":"todo","impact":"対数損失","why":"現在のスピード指数はレース内で標準化しているため、レース間の比較ができない。「弱いメンバー相手の楽勝」と「強いメンバー相手の接戦」が同じ値になってしまう。開催日×コース×馬場状態ごとの基準タイムを推定して差し引けば、絶対的な能力比較ができる。","done":"日×コース単位の馬場差を推定するモジュールと、それを用いた絶対スピード指数。推定には当該開催日より前のレースのみを使い、as-of 制約を破らないこと。","depends":["D1"],"files":["src/data/features.py"]},{"id":"F3","title":"血統特徴量 (種牡馬・母父の適性)","category":"features","priority":"P1","effort":"M","status":"todo","impact":"対数損失 (特に若駒戦)","why":"出走履歴が 1〜2 戦しかない 2〜3 歳馬では、個体の過去成績よりも血統のほうが情報量が多い。新馬・未勝利は全レースの相当部分を占めるのに、現在そこでは実質的に無情報で予測している。 JV-Data の UM/HN/SK から、父と母父ごとの芝ダート適性・距離適性・馬場適性を当該レース以前の産駒成績として集計する。","done":"種牡馬と母父の as-of 集計が入り、キャリア 2 戦以下のサブセットで対数損失が改善する。","depends":["D1"],"files":["src/data/features.py","src/data/sources/jravan_csv.py"]},{"id":"F4","title":"調教データの取り込み","category":"features","priority":"P1","effort":"M","status":"todo","impact":"対数損失 (特に休養明け)","why":"追切のタイム・本数・コース・直前の負荷は、休養明けの仕上がりを直接見られる唯一の情報。現在は前走からの間隔 (days_since) しか持っておらず、休み明けが good か太め残りかを区別できない。","done":"JV-Data HC 由来の調教特徴量が入り、休養明け (60 日以上) のサブセットで対数損失が改善する。","depends":["D1"],"files":["src/data/features.py","src/data/sources/jravan_csv.py"]},{"id":"F5","title":"枠順・コースバイアスの as-of 集計","category":"features","priority":"P1","effort":"S","status":"todo","impact":"対数損失","why":"小回りの内枠有利、重馬場の外枠不利といった傾向は実在するが、現在は枠番と馬番を生値で渡し、コース条件との交互作用を木に見つけさせているだけ。競馬場×距離×馬場状態ごとの枠順別成績を集計して直接与えたほうが、少ないデータで学習できる。","done":"枠順バイアスの as-of 集計が特徴量に入る。","depends":["D1"],"files":["src/data/features.py"]},{"id":"F6","title":"騎手・厩舎の条件別集計と乗り替わり","category":"features","priority":"P1","effort":"S","status":"done","impact":"対数損失","why":"騎手特徴量が全条件こみの勝率と平均着順しかなく、コース別・距離別の成績、継続騎乗か乗り替わりか、厩舎との組み合わせが表現できていなかった。条件を細かく割るとセルあたりの騎乗数が 16 程度まで落ちるため、単純な集計ではノイズになる。","done":"条件別の騎手集計、乗り替わりフラグ、騎手×厩舎の集計が入る。","result":"騎手×競馬場・芝ダ・距離帯・馬場状態を経験ベイズ縮小つきで実装。外すと対数損失が +0.019 悪化する (シード分散±0.001)。騎手勝率は「良い馬に乗れる」との交絡があるため、馬の実力からの残差で測る jky_resid も追加。一方で乗り替わりフラグ (-0.004) と馬×騎手の相性 (+0.001) は合成データでは効果が出なかった。相性はペアあたりの騎乗数が中央値 1 で、縮小後はほぼ馬自身の事前分布に戻るため。","files":["src/data/features.py"]},{"id":"F7","title":"馬の条件別集計 (競馬場・馬場状態・クラス)","category":"features","priority":"P1","effort":"S","status":"done","impact":"対数損失","why":"馬の条件別成績が芝ダートと距離帯しかなく、コース相性、重馬場巧者かどうか、クラス別の成績が表現できていなかった。競馬場・馬場状態・クラスは生のカテゴリ変数として渡していただけで、木に交互作用を探させていた。","done":"馬×競馬場・馬場状態・クラスの as-of 集計が縮小推定つきで入る。","result":"実装済み。この family を外すと対数損失が +0.067 悪化し、全 family 中で最大の寄与。 1 頭あたりの出走数が少ないため縮小の事前分布は馬自身の通算成績、擬似カウントは 4。","files":["src/data/features.py"]},{"id":"K4","title":"市場インパクトとプール規模の上限をモデル化する","category":"market","priority":"P1","effort":"M","status":"todo","impact":"回収率の現実性","why":"複勝・馬連と地方競馬を入れたことで、シミュレーションが現実には存在しない容量を前提にしはじめた。複利のバックテストは資金を 200 億円まで伸ばすが、その規模で買えば自分の購入がオッズを動かす。とくに地方競馬のプールは小さく、馬連の 1 点に 100 万円を入れれば配当は確実に下がる。現在の上限は 1 点あたりの定額 (`MAX_STAKE_YEN`) だけで、プール規模に対する比率になっていない。","done":"券種・主催者ごとのプール規模を取り込み、購入額がオッズに与える影響を織り込んで精算する。投入額がプールの何割かを超えたら自動的に見送る。定額の上限はその比率上限に置き換える。","files":["src/betting/strategy.py","src/backtest/simulator.py","src/common/config.py"]},{"id":"L1","title":"発走時刻とオッズ取得時刻を記録する","category":"market","priority":"P1","effort":"S","status":"todo","impact":"回収率の現実性","why":"当日運用の経路は動くようになったが、取り込んだオッズが締切何分前のものかを記録していない。人気馬ほど直前に売れてオッズが下がるため、いつ見た値かが分からないと、バックテストで使っている 5% のオッズ控除が妥当なのかを検証できない。K1 の前提条件でもある。","done":"出走表に発走時刻が入り、台帳がオッズ取得時刻と発走時刻の差を保持する。締切何分前に取得したかの分布が出せる。","files":["src/live/providers/base.py","src/live/ledger.py"]},{"id":"L2","title":"定期再学習を当日運用に組み込む","category":"data","priority":"P1","effort":"M","status":"todo","impact":"対数損失","why":"バックテストは四半期ごとにモデルを学習しなおしているが、当日運用はその時点の artifacts/ をそのまま使う。放置すると学習時点から離れるほど劣化し、バックテストが検証した条件から外れていく。いつ再学習したかが記録されていないため、劣化に気づく手段も無い。","done":"再学習のスケジュールと、artifacts/ に学習日・学習期間を記録する仕組みが入る。当日の予想に「モデルの学習日から何日経っているか」が表示される。","files":["src/models/train_lgbm.py","src/live/paper_trader.py"]},{"id":"X2","title":"地方競馬 (NAR) の取り込み","category":"data","priority":"P1","effort":"M","status":"done","impact":"週次リターン","why":"1 点あたりのエッジを上げるのは難しいが、賭けられる回数を増やすのは構造の問題で解ける。複利は対数で足し算になるため、週次リターンの天井は「1 点あたりの成長×週あたりの点数」で決まる。 JRA は週 2 開催日しかない。地方競馬はほぼ毎日開催しており、取り込めば週あたりの点数が 3 倍前後になる。現在のエッジで 4 倍に必要な 292 点は、JRA だけなら約 4 週、地方を含めれば約 1.5 週に縮む。エッジを 3.8 倍にするより、開催日を 3 倍にするほうがはるかに現実的。","done":"地方競馬のデータソースが実装され、Phase 1〜4b が JRA と地方の混合データで通る。競馬場ごとの傾向差 (小回り、砂質、逃げ有利) が条件別特徴量で表現できていることを確認する。","result":"実装済み。地方競馬プリセット (平日開催・ダート中心・小頭数・独自の競馬場コードとクラス体系・控除率 25%) を生成器に追加し、CombinedSource が JRA と結合する。race_id の衝突と同日二重出走を結合時に検査する。organizer は複数組織が混在するときだけ特徴量に加わる。","depends":["D1"],"files":["src/data/sources/","src/common/sport.py"]},{"id":"C1","title":"フィールドサイズ別の確率較正","category":"probability","priority":"P2","effort":"S","status":"todo","impact":"較正誤差 (ECE)","why":"Plackett-Luce の温度と等調回帰が全体で 1 本しかない。 8 頭立てと 18 頭立てではスコアの分散も勝率の水準も違うため、片方に合わせた較正はもう片方を歪める。ケリー基準は確率の正しさを前提に賭け金を決めるので、ここの歪みはそのまま資金管理の歪みになる。","done":"頭数バケット別に温度と較正曲線を持ち、全バケットで ECE が改善する。","files":["src/models/calibration.py","src/models/plackett_luce.py"]},{"id":"C2","title":"2 着・3 着確率の Henery 補正","category":"probability","priority":"P2","effort":"M","status":"done","impact":"複数券種の較正誤差","why":"Plackett-Luce (Harville 型) は 1 着確率から 2 着・3 着を導くとき、強い馬の連対率を系統的に過大評価することが知られている。べき乗ディスカウント (Stern / Henery 型) を導入し、実測の着順分布でパラメータをフィットする。複勝・馬連・3 連単に手を広げる前の必須条件。","done":"2 着・3 着の予測分布が実測と一致し、複勝確率の ECE が現在の Harville 版より改善する。","result":"実装済み。Stern / Henery 型のべき乗ディスカウントを Plackett-Luce に入れ、較正スライスでλとμを最尤推定する。λ=1 は従来の Harville と厳密に一致するため既存の値は変わらない。生成側にλ=0.65 の走り方を入れたデータで、推定値はλ=0.69 / μ=0.66 と回収できた。","files":["src/models/plackett_luce.py"]},{"id":"F8","title":"相性・乗り替わり特徴量を実データで再評価する","category":"features","priority":"P2","effort":"S","status":"todo","impact":"対数損失","why":"馬×騎手の相性 (+0.001) と乗り替わり (-0.004) は、合成データでは効果が測れなかった。合成データに相性の構造自体は入れてあるので、これは「効果が無い」ではなく「ペアあたり中央値 1 騎乗では推定できない」という結論。実データでも同じ結論になるとは限らないため、 D1 のあとに測り直し、payoff が無ければ削る。","done":"実データで F8 対象の family をアブレーションし、寄与が無ければ削除してその判断を記録する。","depends":["D1","V4"],"files":["src/data/features.py","src/models/ablation.py"]},{"id":"M1","title":"シード平均アンサンブル","category":"model","priority":"P2","effort":"S","status":"todo","impact":"対数損失","why":"単一シードの勾配ブースティングは分散が大きく、特に木の分割がランダム性に左右される。 5〜10 シードの平均は実装が軽く、ほぼ確実に対数損失を下げる。ハイパーパラメータ探索より先にやるべきで、費用対効果が最も高いモデル側の施策。","done":"複数シードの平均スコアで推論し、ホールドアウトの対数損失が単一シードより改善する。","files":["src/models/ranker.py","src/models/train_lgbm.py"]},{"id":"M2","title":"リセンシー重み付き学習","category":"model","priority":"P2","effort":"S","status":"todo","impact":"対数損失","why":"2018 年のレースと 2023 年のレースを同じ重みで学習している。馬場改修、調教技術の変化、騎手の世代交代でデータの性質は動くため、指数減衰の重みを入れる。半減期はウォークフォワードで選ぶ。","done":"サンプル重みが入り、半減期をウォークフォワードで選んだ結果が現状より改善する。","files":["src/models/ranker.py"]},{"id":"M3","title":"ハイパーパラメータ探索","category":"model","priority":"P2","effort":"M","status":"todo","impact":"対数損失","why":"現在のパラメータは決め打ち。ただし探索空間を広げるほど選択バイアスが増えるため、 V3 で上振れ幅を測れるようにしてから着手する。順序を逆にすると、改善したように見えて実際には過学習しただけ、という結果を判別できない。","done":"時系列分割上での探索が実装され、V3 の枠組みで選択バイアスを差し引いた上で改善している。","depends":["V3","M1"],"files":["src/models/train_lgbm.py"]},{"id":"M4","title":"寄与が負の特徴量 family を整理する","category":"model","priority":"P2","effort":"S","status":"todo","impact":"対数損失","why":"アブレーションでは、レース内相対順位 (-0.011) と静的特徴量 (-0.005) を外したほうが対数損失が良くなった。条件別特徴量が同じ情報をより直接的に持つようになったため、冗長になった可能性がある。ただし 1 ウィンドウの測定で特徴量を削るのは、 V3 で警戒しているのと同じ選択バイアスなので、V4 の複数ウィンドウ測定を待つ。","done":"複数ウィンドウで一貫して寄与が負の family を削除し、削除後に全体が改善することを確認する。","depends":["V4"],"files":["src/data/features.py"]},{"id":"K1","title":"締切前オッズの時系列を取り込む","category":"market","priority":"P3","effort":"L","status":"todo","impact":"回収率の現実性","why":"バックテストは確定オッズで精算し、5% のオッズ控除で代用している。実際には締切数分前のオッズでしか買えず、人気馬ほど直前に売れてオッズが下がる。期待値の計算がオッズに直接依存する以上、この当てずっぽうの控除率は最終的に実測に置き換える必要がある。","done":"締切前オッズの時系列が取り込まれ、odds_haircut が実測のオッズドリフトに置き換わる。","files":["src/data/sources/jravan_csv.py","src/backtest/simulator.py"]},{"id":"K2","title":"人気薄バイアスの明示的モデル化","category":"market","priority":"P3","effort":"M","status":"todo","impact":"回収率","why":"オッズから逆算した確率は、人気薄を過大評価し人気馬を過小評価することが知られている (favourite-longshot bias)。現在は Benter ブレンドが暗黙にこれを吸収しているが、オッズ帯ごとの補正を明示的に持たせたほうが、どこでエッジが出ているかを説明できる。","done":"オッズ帯別の市場確率補正が入り、オッズ帯別の回収率が均されるか、偏りの理由が説明できる。","depends":["C1"],"files":["src/models/market_blend.py"]},{"id":"K3","title":"複勝・馬連への拡張","category":"market","priority":"P3","effort":"M","status":"done","impact":"ベット機会の増加","why":"Plackett-Luce 層は既に複勝・馬連・3 連単の確率を出せる。単勝より控除率が低い券種や、相関の取り方で歪みが残りやすい券種にエッジがある可能性がある。ただし確率が正しいことが前提なので C2 が先。","done":"複数券種のオッズが取り込まれ、券種横断で期待値順にケリー配分できる。","result":"実装済み。単勝・複勝・馬連を同じ期待値とケリーの枠組みで扱う。複勝の払戻頭数は出走頭数から決まる。馬連のオッズは実データでは実際のプールを使い、無い場合は単勝プールから Harville で模擬する。重なりのある券種の同時ケリー厳密解は未実装で、個別に算出してレース上限へ縮小している (過小になることはあっても上限は超えない)。","depends":["C2","K1"],"files":["src/betting/strategy.py","src/backtest/simulator.py"]},{"id":"X1","title":"競輪・競艇アダプタ","category":"data","priority":"P3","effort":"M","status":"todo","impact":"対象競技の拡大","why":"DataSource を継承したアダプタを 1 つ書けば、学習・較正・ベッティング・バックテストはそのまま動く。競艇は 6 艇固定でコース別の決まり手が強く効くため、競馬より予測しやすい可能性がある。ただし同日複数走があるため、特徴量の as-of キーを日付から日付 + レース番号に変える必要がある。","done":"競艇のデータソースが実装され、Phase 1〜4b が競艇データで通る。","files":["src/data/sources/","src/data/features.py","src/common/sport.py"]}],"counts":{"P0":5,"P1":11,"P2":7,"P3":4},"categories":["data","features","market","model","probability","validation"]}}</script>
<script>
(function () {
  "use strict";

  /* ---------- formatting ---------- */
  const F = {
    pct: (v, d) => v == null ? "—" : (v * 100).toFixed(d == null ? 1 : d) + "%",
    num: (v, d) => v == null ? "—" : v.toLocaleString("ja-JP", { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }),
    yen: (v) => {
      if (v == null) return "—";
      const a = Math.abs(v);
      if (a >= 1e8) return (v / 1e8).toFixed(2) + "億円";
      if (a >= 1e4) return (v / 1e4).toFixed(a >= 1e6 ? 0 : 1) + "万円";
      return Math.round(v).toLocaleString("ja-JP") + "円";
    },
    fx: (v, d) => v == null ? "—" : v.toFixed(d == null ? 2 : d),
  };
  const el = (tag, attrs, kids) => {
    const n = document.createElement(tag);
    for (const k in (attrs || {})) {
      if (k === "class") n.className = attrs[k];
      else if (k === "html") n.innerHTML = attrs[k];
      else if (k === "text") n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    (kids || []).forEach(c => n.appendChild(c));
    return n;
  };
  const NS = "http://www.w3.org/2000/svg";
  const s = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  /* ---------- scales & ticks ---------- */
  function niceTicks(lo, hi, count) {
    if (!(hi > lo)) return [lo];
    const span = hi - lo, raw = span / (count || 5);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = (norm >= 7.5 ? 10 : norm >= 3.5 ? 5 : norm >= 1.5 ? 2 : 1) * mag;
    const out = [];
    for (let t = Math.ceil(lo / step) * step; t <= hi + step * 1e-6; t += step) out.push(+t.toFixed(10));
    return out;
  }
  function logTicks(lo, hi) {
    const out = [];
    for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) {
      for (const m of [1, 2, 5]) {
        const v = m * Math.pow(10, e);
        if (v >= lo * 0.999 && v <= hi * 1.001) out.push(v);
      }
    }
    return out.length > 1 ? out : [lo, hi];
  }

  /* ---------- responsive chart host ---------- */
  function mount(host, draw) {
    const tip = el("div", { class: "tip" });
    host.appendChild(tip);
    let raf = 0;
    const render = () => {
      const w = Math.max(240, host.clientWidth);
      [...host.querySelectorAll("svg")].forEach(n => n.remove());
      const svg = draw(w, tip);
      host.insertBefore(svg, tip);
    };
    const schedule = () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(render); };
    render();
    // a chart built inside a hidden page measures zero; both of these catch the
    // moment it becomes visible
    if (window.ResizeObserver) new ResizeObserver(schedule).observe(host);
    window.addEventListener("resize", schedule);
  }
  function showTip(tip, host, x, y, html) {
    tip.innerHTML = html;
    tip.style.left = x + "px";
    tip.style.top = y + "px";
    tip.style.opacity = "1";
  }
  const hideTip = (tip) => { tip.style.opacity = "0"; };

  /* ---------- line chart (time series) ---------- */
  function lineChart(host, opts) {
    mount(host, (w, tip) => {
      const h = opts.height || 260;
      const m = { t: 14, r: opts.padRight == null ? 56 : opts.padRight, b: 26, l: opts.padLeft == null ? 58 : opts.padLeft };
      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const pts = opts.points;
      const log = !!opts.log;
      let lo = opts.min != null ? opts.min : Math.min(...pts.map(p => p.y));
      let hi = opts.max != null ? opts.max : Math.max(...pts.map(p => p.y));
      if (log) { lo = Math.max(lo, 1e-9); } else if (lo === hi) { hi = lo + 1; }
      const tr = log ? (v => (Math.log10(Math.max(v, 1e-9)) - Math.log10(lo)) / (Math.log10(hi) - Math.log10(lo)))
                     : (v => (v - lo) / (hi - lo));
      const X = i => m.l + (pts.length < 2 ? iw / 2 : (i / (pts.length - 1)) * iw);
      const Y = v => m.t + ih - tr(v) * ih;
      const svg = s("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: "img", "aria-label": opts.aria || "" });
      const ticks = log ? logTicks(lo, hi) : niceTicks(lo, hi, 5);
      ticks.forEach(t => {
        svg.appendChild(s("line", { x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t), stroke: css("--grid"), "stroke-width": 1 }));
        const lb = s("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end", fill: css("--muted"), "font-size": 11,
          "font-family": "IBM Plex Mono, monospace" });
        lb.textContent = opts.fmtY ? opts.fmtY(t) : t;
        svg.appendChild(lb);
      });
      const zero = opts.zeroLine;
      if (zero != null && zero >= lo && zero <= hi) {
        svg.appendChild(s("line", { x1: m.l, x2: m.l + iw, y1: Y(zero), y2: Y(zero), stroke: css("--axis"), "stroke-width": 1 }));
      }
      const color = opts.color || css("--s1");
      const dLine = pts.map((p, i) => (i ? "L" : "M") + X(i) + " " + Y(p.y)).join(" ");
      const base = Y(opts.areaBase != null ? Math.max(lo, Math.min(hi, opts.areaBase)) : lo);
      svg.appendChild(s("path", { d: dLine + ` L${X(pts.length - 1)} ${base} L${X(0)} ${base} Z`, fill: color, "fill-opacity": .1, stroke: "none" }));
      svg.appendChild(s("path", { d: dLine, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      // x labels: first, middle, last
      [0, Math.floor(pts.length / 2), pts.length - 1].filter((v, i, a) => a.indexOf(v) === i).forEach((i, k, arr) => {
        const t = s("text", { x: X(i), y: h - 8, fill: css("--muted"), "font-size": 11, "font-family": "IBM Plex Mono, monospace",
          "text-anchor": k === 0 ? "start" : k === arr.length - 1 ? "end" : "middle" });
        t.textContent = pts[i].label;
        svg.appendChild(t);
      });
      // endpoint marker + direct label
      const last = pts[pts.length - 1];
      svg.appendChild(s("circle", { cx: X(pts.length - 1), cy: Y(last.y), r: 5, fill: color, stroke: css("--surface"), "stroke-width": 2 }));
      if (opts.endLabel !== false) {
        const t = s("text", { x: X(pts.length - 1) + 9, y: Y(last.y) + 4, fill: css("--ink"), "font-size": 12, "font-weight": 600,
          "font-family": "IBM Plex Mono, monospace" });
        t.textContent = opts.fmtEnd ? opts.fmtEnd(last.y) : (opts.fmtY ? opts.fmtY(last.y) : last.y);
        svg.appendChild(t);
      }
      // crosshair
      const cross = s("line", { x1: 0, x2: 0, y1: m.t, y2: m.t + ih, stroke: css("--axis"), "stroke-width": 1, opacity: 0 });
      const dot = s("circle", { r: 4.5, fill: color, stroke: css("--surface"), "stroke-width": 2, opacity: 0 });
      svg.appendChild(cross); svg.appendChild(dot);
      const hit = s("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent" });
      svg.appendChild(hit);
      hit.addEventListener("mousemove", ev => {
        const r = svg.getBoundingClientRect();
        const px = (ev.clientX - r.left) * (w / r.width);
        const i = Math.max(0, Math.min(pts.length - 1, Math.round((px - m.l) / iw * (pts.length - 1))));
        const p = pts[i];
        cross.setAttribute("x1", X(i)); cross.setAttribute("x2", X(i)); cross.setAttribute("opacity", 1);
        dot.setAttribute("cx", X(i)); dot.setAttribute("cy", Y(p.y)); dot.setAttribute("opacity", 1);
        showTip(tip, host, X(i) * (r.width / w), Y(p.y) * (r.height / h), opts.tip ? opts.tip(p) : p.label);
      });
      hit.addEventListener("mouseleave", () => { cross.setAttribute("opacity", 0); dot.setAttribute("opacity", 0); hideTip(tip); });
      return svg;
    });
  }

  /* ---------- bar chart ---------- */
  function barChart(host, opts) {
    mount(host, (w, tip) => {
      const h = opts.height || 200;
      const m = { t: 20, r: 10, b: opts.padBottom || 30, l: opts.padLeft == null ? 50 : opts.padLeft };
      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const data = opts.data;
      const vals = data.map(d => d.v).filter(v => v != null);
      let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
      if (opts.min != null) lo = opts.min;
      if (opts.max != null) hi = opts.max;
      if (lo === hi) hi = lo + 1;
      const Y = v => m.t + ih - ((v - lo) / (hi - lo)) * ih;
      const band = iw / data.length;
      const bw = Math.min(opts.thick || 24, band - 6);
      const svg = s("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: "img", "aria-label": opts.aria || "" });
      niceTicks(lo, hi, 4).forEach(t => {
        svg.appendChild(s("line", { x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t), stroke: css("--grid"), "stroke-width": 1 }));
        const lb = s("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end", fill: css("--muted"), "font-size": 10.5,
          "font-family": "IBM Plex Mono, monospace" });
        lb.textContent = opts.fmtY ? opts.fmtY(t) : t;
        svg.appendChild(lb);
      });
      const y0 = Y(Math.max(lo, Math.min(hi, 0)));
      svg.appendChild(s("line", { x1: m.l, x2: m.l + iw, y1: y0, y2: y0, stroke: css("--axis"), "stroke-width": 1 }));
      data.forEach((d, i) => {
        if (d.v == null) return;
        const x = m.l + band * i + (band - bw) / 2;
        const up = d.v >= 0;
        const yv = Y(d.v);
        const bh = Math.max(1.5, Math.abs(yv - y0));
        const c = d.color || opts.color || css("--s1");
        const rr = Math.min(4, bh);
        const top = up ? yv : y0;
        // rounded data-end, square at the baseline
        const path = up
          ? `M${x} ${top + bh} L${x} ${top + rr} Q${x} ${top} ${x + rr} ${top} L${x + bw - rr} ${top} Q${x + bw} ${top} ${x + bw} ${top + rr} L${x + bw} ${top + bh} Z`
          : `M${x} ${top} L${x} ${top + bh - rr} Q${x} ${top + bh} ${x + rr} ${top + bh} L${x + bw - rr} ${top + bh} Q${x + bw} ${top + bh} ${x + bw} ${top + bh - rr} L${x + bw} ${top} Z`;
        const p = s("path", { d: path, fill: c });
        svg.appendChild(p);
        if (opts.label !== false) {
          const t = s("text", { x: x + bw / 2, y: up ? yv - 7 : yv + bh + 13, "text-anchor": "middle", fill: css("--ink-2"),
            "font-size": 10.5, "font-family": "IBM Plex Mono, monospace" });
          t.textContent = opts.fmtLabel ? opts.fmtLabel(d.v, d) : (opts.fmtY ? opts.fmtY(d.v) : d.v);
          svg.appendChild(t);
        }
        const xl = s("text", { x: x + bw / 2, y: h - 9, "text-anchor": "middle", fill: css("--muted"), "font-size": 10.5,
          "font-family": "IBM Plex Mono, monospace" });
        xl.textContent = d.k;
        svg.appendChild(xl);
        const hit = s("rect", { x: m.l + band * i, y: m.t, width: band, height: ih, fill: "transparent" });
        hit.addEventListener("mouseenter", () => {
          p.setAttribute("fill-opacity", .75);
          const r = svg.getBoundingClientRect();
          showTip(tip, host, (m.l + band * i + band / 2) * (r.width / w), Math.min(yv, y0) * (r.height / h), opts.tip ? opts.tip(d) : d.k);
        });
        hit.addEventListener("mouseleave", () => { p.removeAttribute("fill-opacity"); hideTip(tip); });
        svg.appendChild(hit);
      });
      return svg;
    });
  }

  /* ---------- calibration scatter ---------- */
  function calibChart(host, rows) {
    mount(host, (w, tip) => {
      const h = 300, m = { t: 14, r: 16, b: 38, l: 50 };
      const iw = w - m.l - m.r, ih = h - m.t - m.b;
      const hi = Math.max(0.35, ...rows.map(r => Math.max(r.p_mean, r.obs_rate))) * 1.05;
      const X = v => m.l + (v / hi) * iw, Y = v => m.t + ih - (v / hi) * ih;
      const svg = s("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: "img", "aria-label": "予測確率と実測勝率の較正" });
      niceTicks(0, hi, 4).forEach(t => {
        svg.appendChild(s("line", { x1: m.l, x2: m.l + iw, y1: Y(t), y2: Y(t), stroke: css("--grid"), "stroke-width": 1 }));
        const a = s("text", { x: m.l - 8, y: Y(t) + 4, "text-anchor": "end", fill: css("--muted"), "font-size": 11, "font-family": "IBM Plex Mono, monospace" });
        a.textContent = (t * 100).toFixed(0) + "%"; svg.appendChild(a);
        const b = s("text", { x: X(t), y: h - 20, "text-anchor": "middle", fill: css("--muted"), "font-size": 11, "font-family": "IBM Plex Mono, monospace" });
        b.textContent = (t * 100).toFixed(0) + "%"; svg.appendChild(b);
      });
      // 45-degree reference = perfect calibration
      svg.appendChild(s("line", { x1: X(0), y1: Y(0), x2: X(hi), y2: Y(hi), stroke: css("--axis"), "stroke-width": 2, "stroke-linecap": "round" }));
      const c = css("--s1");
      const d = rows.map((r, i) => (i ? "L" : "M") + X(r.p_mean) + " " + Y(r.obs_rate)).join(" ");
      svg.appendChild(s("path", { d: d, fill: "none", stroke: c, "stroke-width": 2, "stroke-linejoin": "round" }));
      rows.forEach(r => {
        const dot = s("circle", { cx: X(r.p_mean), cy: Y(r.obs_rate), r: 5, fill: c, stroke: css("--surface"), "stroke-width": 2 });
        svg.appendChild(dot);
        const hit = s("circle", { cx: X(r.p_mean), cy: Y(r.obs_rate), r: 14, fill: "transparent" });
        hit.addEventListener("mouseenter", () => {
          const rc = svg.getBoundingClientRect();
          showTip(tip, host, X(r.p_mean) * (rc.width / w), Y(r.obs_rate) * (rc.height / h),
            `<span class="k">予測</span><b>${F.pct(r.p_mean)}</b><br><span class="k">実測</span><b>${F.pct(r.obs_rate)}</b><br><span class="k">頭数</span>${F.num(r.n)}`);
        });
        hit.addEventListener("mouseleave", () => hideTip(tip));
        svg.appendChild(hit);
      });
      const xt = s("text", { x: m.l + iw / 2, y: h - 2, "text-anchor": "middle", fill: css("--muted"), "font-size": 11 });
      xt.textContent = "モデルの予測勝率"; svg.appendChild(xt);
      return svg;
    });
  }

  /* ---------- roadmap board ---------- */
  const PRIO = {
    P0: { c: "--critical", t: "測定の土台", d: "これが無いと、以降の施策で精度が上がったかどうかを判定できない" },
    P1: { c: "--serious",  t: "特徴量", d: "実データ上で精度を最も大きく動かす。欠けている情報を足す" },
    P2: { c: "--s1",       t: "モデルと確率層", d: "同じ特徴量からより多くを引き出す。費用対効果の高い順" },
    P3: { c: "--muted",    t: "市場と拡張", d: "実際に買える価格での検証と、券種・競技の拡大" },
  };
  const CAT = { validation: "検証", data: "データ", features: "特徴量", model: "モデル", probability: "確率", market: "市場" };
  const EFFORT = { S: "1日以内", M: "数日", L: "1週間以上" };
  const STATUS = { todo: "未着手", doing: "着手中", done: "完了", blocked: "待ち" };

  function roadmapCard(R) {
    const card = el("div", { class: "card" });
    card.appendChild(el("h2", { text: "改善ロードマップ" }));
    if (R.meta && R.meta.intro) card.appendChild(el("div", { class: "rm-intro", text: R.meta.intro }));
    if (R.meta && R.meta.updated_note) {
      card.appendChild(el("div", { class: "verdict", style: "margin:0 0 14px", text: R.meta.updated_note }));
    }

    if ((R.evidence || []).length) {
      const ev = el("div", { class: "ev" });
      R.evidence.forEach(e => {
        const d = el("div");
        d.appendChild(el("div", { class: "k", text: e.label }));
        d.appendChild(el("div", { class: "v", text: e.value }));
        d.appendChild(el("div", { class: "d", text: e.detail }));
        ev.appendChild(d);
      });
      card.appendChild(ev);
    }

    const state = { priority: "all", category: "all" };
    const body = el("div");
    const filters = el("div", { class: "filters" });
    const chips = [];
    const mkChip = (key, val, label) => {
      const b = el("button", { class: "chip", type: "button", text: label });
      b.setAttribute("aria-pressed", String(state[key] === val));
      b.addEventListener("click", () => {
        state[key] = val;
        chips.forEach(c => c.b.setAttribute("aria-pressed", String(state[c.key] === c.val)));
        draw();
      });
      chips.push({ b: b, key: key, val: val });
      filters.appendChild(b);
      return b;
    };
    filters.appendChild(el("span", { class: "lbl", text: "優先度" }));
    mkChip("priority", "all", `すべて ${R.tasks.length}`);
    Object.keys(PRIO).forEach(p => { if (R.counts[p]) mkChip("priority", p, `${p} ${R.counts[p]}`); });
    filters.appendChild(el("span", { class: "sep" }));
    filters.appendChild(el("span", { class: "lbl", text: "分野" }));
    mkChip("category", "all", "すべて");
    (R.categories || []).forEach(c => mkChip("category", c, CAT[c] || c));
    card.appendChild(filters);
    card.appendChild(body);

    function draw() {
      body.innerHTML = "";
      const shown = R.tasks.filter(t =>
        (state.priority === "all" || t.priority === state.priority) &&
        (state.category === "all" || t.category === state.category));
      if (!shown.length) {
        body.appendChild(el("div", { class: "rm-empty", text: "この条件に合うタスクはありません。" }));
        return;
      }
      Object.keys(PRIO).forEach(pk => {
        const list = shown.filter(t => t.priority === pk);
        if (!list.length) return;
        const g = el("div", { class: "pgroup", style: `--pc:var(${PRIO[pk].c})` });
        const hd = el("div", { class: "pghead" });
        hd.appendChild(el("span", { class: "tag-p", text: pk }));
        hd.appendChild(el("h3", { text: PRIO[pk].t }));
        const open = list.filter(x => x.status !== "done").length;
        hd.appendChild(el("span", { class: "n",
          text: open === list.length ? `${list.length} 件` : `${open} 件 / 完了 ${list.length - open}` }));
        g.appendChild(hd);
        g.appendChild(el("div", { class: "rm-intro", text: PRIO[pk].d }));
        const grid = el("div", { class: "tasks" });
        list.forEach(t => {
          const c = el("div", { class: "task" + (t.status === "done" ? " is-done" : "") });
          const top = el("div", { class: "top" });
          top.appendChild(el("span", { class: "tid", text: t.id }));
          top.appendChild(el("h4", { text: t.title }));
          c.appendChild(top);
          const tags = el("div", { class: "tags" });
          tags.appendChild(el("span", { class: "tag", text: CAT[t.category] || t.category }));
          tags.appendChild(el("span", { class: "tag", text: `工数 ${EFFORT[t.effort] || t.effort}` }));
          tags.appendChild(el("span", { class: "tag", text: `効く指標: ${t.impact}` }));
          tags.appendChild(el("span", { class: "tag" + (t.status === "blocked" ? " blocked" : ""),
            text: STATUS[t.status] || t.status }));
          c.appendChild(tags);
          c.appendChild(el("p", { text: t.why }));
          if (t.result) {
            const res = el("div", { class: "res" });
            res.appendChild(el("span", { class: "h", text: "実装済み・測定結果" }));
            res.appendChild(el("span", { text: t.result }));
            c.appendChild(res);
          }
          const dod = el("div", { class: "dod" });
          dod.appendChild(el("span", { class: "h", text: "完了条件" }));
          dod.appendChild(el("span", { text: t.done }));
          if (t.blocked_by) {
            dod.appendChild(el("span", { class: "h", text: "待っているもの" }));
            dod.appendChild(el("span", { text: t.blocked_by }));
          }
          if ((t.depends || []).length) {
            dod.appendChild(el("span", { class: "h", text: "先に必要なタスク" }));
            dod.appendChild(el("span", { text: t.depends.join(" · ") }));
          }
          c.appendChild(dod);
          grid.appendChild(c);
        });
        g.appendChild(grid);
        body.appendChild(g);
      });
    }
    draw();
    return card;
  }

  /* ---------- live paper betting (served by src/live/api.py) ---------- */
  const LIVE = { root: null, loaded: false, loading: false };
  const SETUP_STEPS =
    "python src/data/preprocess.py --input raw_data/ --output processed/\n" +
    "python src/models/train_lgbm.py --data processed/train.csv --model_dir artifacts/\n" +
    "python src/live/paper_trader.py bet --provider demo\n" +
    "python src/live/api.py            # http://127.0.0.1:8787";

  function livePage(D) {
    const wrap = el("div");
    LIVE.root = wrap;
    wrap.appendChild(el("div", { class: "loading", text: "ローカル API に接続しています…" }));
    return wrap;
  }

  function liveOffline(reason) {
    const wrap = LIVE.root;
    wrap.innerHTML = "";
    const box = el("div", { class: "live-state warn" });
    box.appendChild(el("span", { class: "dot-live off" }));
    const body = el("div");
    body.appendChild(el("p", { html:
      "<b>ローカル API に接続していません。</b>このページだけはライブのデータを読みます。" +
      "公開されているダッシュボードは静的なスナップショットなので、当日の予想はご自身の環境で以下を実行してください。" }));
    body.appendChild(el("pre", { text: SETUP_STEPS }));
    body.appendChild(el("p", { style: "margin:8px 0 0", text:
      "起動後、同じアドレス (既定は http://127.0.0.1:8787) でこのページを開くと、ここに当日の出走表と推奨購入が並びます。" }));
    if (reason) body.appendChild(el("p", { style: "margin:6px 0 0; font-size:11.5px; color:var(--muted)",
      text: "接続時のエラー: " + reason }));
    box.appendChild(body);
    wrap.appendChild(box);

    const note = el("div", { class: "card" });
    note.appendChild(el("h2", { text: "データの取り込みについて" }));
    note.appendChild(el("div", { class: "desc", text:
      "JRA には公開 API がありません。実際に使える経路は次の 3 つで、どれを選んでもその先の処理は同じです。" }));
    const rules = el("div", { class: "rules" });
    [["JRA-VAN Data Lab.", "--provider jravan", "公式の有料購読。JV-Link は Windows の COM のため Windows 必須"],
     ["自分で用意した CSV", "--provider csv", "live_data/cards と odds に置くだけ。購読が無くても今日から動く"],
     ["任意の JSON API", "--provider http", "live_data/provider.yml で URL と項目名を対応づける。コード変更不要"]].forEach(([k, v, d]) => {
      const n = el("div", { class: "rule" });
      n.appendChild(el("div", { class: "k", text: k }));
      n.appendChild(el("div", { class: "v", text: v }));
      n.appendChild(el("div", { class: "d", text: d }));
      rules.appendChild(n);
    });
    note.appendChild(rules);
    wrap.appendChild(note);

  function liveRender(slip, summary, dates) {
    const wrap = LIVE.root;
    wrap.innerHTML = "";
    const S = summary && summary.summary ? summary.summary : null;

    const box = el("div", { class: "live-state" });
    box.appendChild(el("span", { class: "dot-live" }));
    const meta = el("div");
    meta.appendChild(el("p", { html: slip
      ? `<b>${slip.date} の出走表を読み込みました。</b>データ元 <span class="mono">${slip.provider}</span>、` +
        `作成 ${slip.generated_at}。方針は α=${slip.policy.alpha} / EV≥${slip.policy.ev_threshold} / ` +
        `1レース${slip.policy.max_bets_per_race}点 (${slip.policy.source === "sweep" ? "探索で選ばれた値" : slip.policy.source})。`
      : "<b>API には接続できていますが、まだ当日の予想がありません。</b>" }));
    if (!slip) meta.appendChild(el("pre", { text: "python src/live/paper_trader.py bet --provider demo" }));
    else if ((dates || []).length > 1) meta.appendChild(el("p", { style: "margin:0; font-size:11.5px; color:var(--muted)",
      text: `保存されている日: ${dates.slice(-6).join(" / ")}` }));
    box.appendChild(meta);
    wrap.appendChild(box);

    if (S && S.n_bets) {
      const kp = el("div", { class: "kpis" });
      const tile = (lab, val, note) => {
        const d = el("div", { class: "kpi" });
        d.appendChild(el("div", { class: "lab", text: lab }));
        d.appendChild(el("div", { class: "val", text: val }));
        if (note) d.appendChild(el("div", { class: "note", text: note }));
        return d;
      };
      const hero = tile("ペーパー資金", F.yen(S.bankroll), `元手 ${F.yen(S.start_bankroll)}`);
      hero.className = "kpi hero";
      kp.appendChild(hero);
      kp.appendChild(tile("回収率", S.recovery_rate == null ? "—" : F.pct(S.recovery_rate),
        S.n_settled ? `確定 ${F.num(S.n_settled)} 点` : "未確定"));
      kp.appendChild(tile("的中率", S.hit_rate == null ? "—" : F.pct(S.hit_rate), ""));
      kp.appendChild(tile("損益", (S.total_profit >= 0 ? "+" : "") + F.yen(S.total_profit),
        `投入 ${F.yen(S.total_staked)}`));
      kp.appendChild(tile("未確定", F.num(S.n_open), `${F.yen(S.at_risk)} が確定待ち`));
      kp.appendChild(tile("期間", S.first_bet === S.last_bet ? S.first_bet : `${S.first_bet} 〜`,
        `${F.num(S.n_bets)} 点`));
      const sm0 = slip && slip.summary ? slip.summary : {};
      kp.appendChild(tile("直近の平均オッズ", sm0.avg_odds == null ? "—" : F.fx(sm0.avg_odds, 1) + "倍",
        sm0.avg_ev == null ? "" : `平均期待値 ${F.fx(sm0.avg_ev)}`));
      wrap.appendChild(kp);
    }

    if (slip) {
      const c = el("div", { class: "card" });
      c.appendChild(el("h2", { text: `${slip.date} の推奨購入` }));
      const sm = slip.summary;
      c.appendChild(el("div", { class: "desc", text: sm.n_bets
        ? `${sm.n_races} レース中 ${sm.n_races_bet} レースで期待値が閾値を超えました。` +
          `合計 ${F.yen(sm.total_stake)}、平均期待値 ${F.fx(sm.avg_ev)}、平均 ${F.fx(sm.avg_odds, 1)} 倍。` +
          `賭けない判断のほうが多いのが正常です。`
        : "期待値が閾値を超えた馬はいませんでした。見送りはシステムが働いている状態であって、失敗ではありません。" }));
      if (sm.n_bets) {
        const tw = el("div", { class: "tw" });
        const t = el("table");
        t.innerHTML = "<thead><tr><th>レース</th><th>馬番・馬</th><th>オッズ</th><th>予測勝率</th><th>期待値</th>" +
          "<th>購入額</th></tr></thead><tbody>" + slip.bets.map(b => {
            const race = slip.races.find(r => r.race_id === b.race_id) || {};
            const run = (race.runners || []).find(r => r.entrant_id === b.entrant_id) || {};
            return `<tr><td class="num">${race.venue || ""} ${race.race_no || ""}R</td>` +
              `<td class="num">${run.post_position != null ? run.post_position + "番 " : ""}${b.entrant_id}</td>` +
              `<td class="num">${F.fx(b.odds, 1)}</td><td class="num">${F.pct(b.prob)}</td>` +
              `<td class="num">${F.fx(b.ev, 3)}</td><td class="num">${F.yen(b.stake)}</td></tr>`;
          }).join("") + "</tbody>";
        t.appendChild(el("caption", { text:
          `資金 ${F.yen(slip.bankroll)} に対して ${(sm.total_stake / slip.bankroll * 100).toFixed(2)}% を投入。` +
          `1 日の上限は ${F.pct(slip.policy.max_daily_exposure || 0.2, 0)}。` }));
        tw.appendChild(t); c.appendChild(tw);
      }
      wrap.appendChild(c);

      const cc = el("div", { class: "card" });
      cc.appendChild(el("h2", { text: "出走表とモデルの確率" }));
      cc.appendChild(el("div", { class: "desc", text:
        "全レース分です。行が強調されているのが購入対象。期待値はモデルの勝率にオッズを掛けた値で、1.0 が損益分岐です。" }));
      slip.races.forEach(r => {
        const d = el("details", { class: "race-card" });
        const sum = el("summary");
        sum.appendChild(el("span", { class: "rno", text: `${r.venue || ""} ${r.race_no}R` }));
        sum.appendChild(el("span", { class: "cond",
          text: `${r.distance_m}m ${r.surface || ""} ${r.going || ""} ${r.n_runners}頭` }));
        sum.appendChild(el("span", { class: "flag" + (r.n_bets ? "" : " none"),
          text: r.n_bets ? `購入 ${r.n_bets} 点` : "見送り" }));
        d.appendChild(sum);
        const inner = el("div", { class: "inner tw" });
        const t = el("table");
        t.innerHTML = "<thead><tr><th>馬番</th><th>馬</th><th>騎手</th><th>オッズ</th><th>予測勝率</th><th>期待値</th>" +
          "<th>購入額</th></tr></thead><tbody>" + r.runners.map(x =>
            `<tr class="${x.stake > 0 ? "picked" : ""}"><td class="num">${x.post_position != null ? x.post_position : "—"}</td>` +
            `<td class="num">${x.entrant_id}</td><td class="num">${x.jockey_id || "—"}</td>` +
            `<td class="num">${x.win_odds == null ? "—" : F.fx(x.win_odds, 1)}</td>` +
            `<td class="num">${F.pct(x.p_win)}</td>` +
            `<td class="num" style="color:${(x.ev || 0) >= (slip.policy.ev_threshold || 1) ? "var(--good-ink)" : "var(--ink-2)"}">` +
            `${x.ev == null ? "—" : F.fx(x.ev, 3)}</td>` +
            `<td class="num">${x.stake > 0 ? F.yen(x.stake) : "—"}</td></tr>`).join("") + "</tbody>";
        inner.appendChild(t);
        d.appendChild(inner);
        cc.appendChild(d);
      });
      wrap.appendChild(cc);
    }

    const daily = (summary && summary.daily) || [];
    if (daily.length) {
      const ch = el("div", { class: "card" });
      ch.appendChild(el("h2", { text: "確定した日ごとの記録" }));
      ch.appendChild(el("div", { class: "desc", text:
        "台帳は追記のみで、決済しても過去の行は書き換えません。結果を知る前に何を決めたかが残ります。" }));
      const tw = el("div", { class: "tw" });
      const t = el("table");
      t.innerHTML = "<thead><tr><th>日付</th><th>点数</th><th>的中</th><th>投入</th><th>損益</th><th>回収率</th>" +
        "<th>資金</th></tr></thead><tbody>" + daily.slice().reverse().map(d =>
          `<tr><td class="num">${d.date}</td><td class="num">${F.num(d.n_bets)}</td><td class="num">${F.num(d.n_won)}</td>` +
          `<td class="num">${F.yen(d.staked)}</td>` +
          `<td class="num" style="color:${d.profit >= 0 ? "var(--good-ink)" : "var(--critical-ink)"}">${F.yen(d.profit)}</td>` +
          `<td class="num">${d.recovery == null ? "—" : F.pct(d.recovery)}</td>` +
          `<td class="num">${F.yen(d.bankroll)}</td></tr>`).join("") + "</tbody>";
      tw.appendChild(t); ch.appendChild(tw);
      wrap.appendChild(ch);
    }
  }

  async function loadLive(force) {
    if (!LIVE.root || LIVE.loading || (LIVE.loaded && !force)) return;
    LIVE.loading = true;
    try {
      const get = async (path) => {
        const r = await fetch(path, { cache: "no-store" });
        if (!r.ok) return null;
        return r.json();
      };
      const health = await get("/api/health");
      if (!health) throw new Error("/api/health に応答がありません");
      const [slip, summary, slips] = await Promise.all([get("/api/today"), get("/api/summary"), get("/api/slips")]);
      liveRender(slip, summary, (slips || {}).dates || []);
      LIVE.loaded = true;
    } catch (err) {
      liveOffline(err && err.message ? err.message : String(err));
      LIVE.loaded = true;
    } finally {
      LIVE.loading = false;
    }
  }

  /* ---------- page ---------- */
  function build(D) {
    const app = document.getElementById("app");
    app.innerHTML = "";
    const K = D.kpi, P = D.policy || {}, M = D.model || {}, SW = (D.sweep && D.sweep.summary) || {};
    const buckets = {};
    ["overview", "today", "performance", "model", "roadmap"].forEach(k => { buckets[k] = el("div"); });
    let PAGE = "overview";
    const page = k => { PAGE = k; };
    const add = n => { buckets[PAGE].appendChild(n); return n; };

    /* header */
    const head = el("header");
    const brand = el("div", { class: "brand" });
    brand.appendChild(el("div", { class: "eyebrow", text: "EquineAlpha · ウォークフォワード検証" }));
    const TICKET_JA = { win: "単勝", place: "複勝", quinella: "馬連" };
    const ticketNames = (D.tickets || []).map(t => TICKET_JA[t.ticket] || t.ticket);
    brand.appendChild(el("h1", { text: (ticketNames.length ? ticketNames.join("・") : "単勝") + "ペーパーベッティング成績" }));
    brand.appendChild(el("div", { class: "sub", text:
      "LightGBM の順位学習で着順を予測し、Plackett-Luce で勝率に変換、Isotonic 回帰で較正した確率を市場オッズと" +
      "突き合わせ、期待値が閾値を超えた買い目にだけ Fractional Kelly で賭けた結果です。" +
      (ticketNames.length > 1 ? "2 着以降の確率にはべき乗ディスカウント補正を通しています。" : "") }));
    head.appendChild(brand);
    const right = el("div", { class: "brand" });
    right.appendChild(el("div", { class: "meta", html:
      `<span>対象 <b>${(D.backtest_window || {}).start || "—"} 〜 ${(D.backtest_window || {}).end || "—"}</b></span>` +
      `<span>生成 <b>${D.generated_at}</b></span>` }));
    head.appendChild(right);
    add(head);

    /* honesty notice */
    const nt = el("div", { class: "notice" });
    nt.appendChild(el("div", { class: "ic", html:
      `<svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M10 2.6 18.3 17H1.7L10 2.6Z" fill="none" stroke="${css("--warn")}" stroke-width="1.6" stroke-linejoin="round"/><path d="M10 7.8v4.1" stroke="${css("--warn")}" stroke-width="1.8" stroke-linecap="round"/><circle cx="10" cy="14.6" r="1" fill="${css("--warn")}"/></svg>` }));
    nt.appendChild(el("p", { html: (D.is_synthetic
      ? "<strong>この数値は合成データによるデモです。</strong>実際の JRA のレース結果・オッズではありません。合成市場の効率性パラメータ次第で回収率は大きく変わるため、実運用の成績を示すものではありません。"
      : "<strong>実データによる結果です。</strong>") +
      ` 精算は確定オッズに ${F.pct(D.odds_haircut, 0)} の控除をかけた保守的な値で行っています。` }));
    add(nt);

    /* KPI tiles */
    const rec = K.roi_recovery_rate, dd = K.max_drawdown;
    const ddState = dd == null ? "warn" : dd > 0.30 ? "bad" : dd > 0.15 ? "warn" : "good";
    const kp = el("div", { class: "kpis" });
    const tile = (lab, val, note, pill) => {
      const d = el("div", { class: "kpi" });
      d.appendChild(el("div", { class: "lab", text: lab }));
      d.appendChild(el("div", { class: "val", text: val }));
      if (pill) d.appendChild(el("div", { class: "pill " + pill[0], html: `<span class="dot"></span>${pill[1]}` }));
      else if (note) d.appendChild(el("div", { class: "note", text: note }));
      return d;
    };
    const SG = D.significance || {};
    const ci = SG.recovery_ci || {};
    const hero = tile("回収率", F.pct(rec), null,
      [SG.significant_at_95 ? "good" : "warn",
       ci.lo == null ? (rec > 1 ? "控除率を上回る" : "控除率に負けている")
                     : `95%区間 ${F.pct(ci.lo)} 〜 ${F.pct(ci.hi)}`]);
    hero.className = "kpi hero";
    kp.appendChild(hero);
    kp.appendChild(tile("最大ドローダウン", F.pct(dd), null, [ddState, ddState === "good" ? "抑制できている" : ddState === "warn" ? "許容範囲" : "要調整"]));
    kp.appendChild(tile("シャープレシオ", F.fx(K.sharpe_daily_annualised), "日次・年率換算"));
    kp.appendChild(tile("的中率", F.pct(K.hit_rate), `平均 ${F.fx(K.avg_odds_bet, 1)} 倍で購入`));
    kp.appendChild(tile("購入点数", F.num(K.n_bets), `${F.num(K.n_races_bet)} レース / ${F.num(K.n_race_days)} 開催日`));
    kp.appendChild(tile("最終資金", F.yen(K.final_bankroll), `元手 ${F.yen(K.start_bankroll)}`));
    const pci = SG.recovery_per_bet_ci || {};
    kp.appendChild(tile("回収率 (1点等重み)", SG.recovery_per_bet == null ? "—" : F.pct(SG.recovery_per_bet),
      pci.lo == null ? `平均期待値 ${F.fx(K.avg_ev_bet)}`
                     : `${F.pct(pci.lo)} 〜 ${F.pct(pci.hi)}  t=${F.fx(SG.t_stat)}`));
    add(kp);

    page("roadmap");
    /* improvement roadmap: its own page, because it is read on its own */
    if (D.roadmap && (D.roadmap.tasks || []).length) add(roadmapCard(D.roadmap));
    page("today");
    add(livePage(D));

    page("overview");
    /* equity curve */
    const c1 = el("div", { class: "card" });
    c1.appendChild(el("h2", { text: "資産曲線" }));
    c1.appendChild(el("div", { class: "desc", text:
      (D.compound === false
        ? `開催日ごとの残高です。賭け金は初期資金に対する定額で、複利にはしていません。`
        : `開催日ごとの残高です。複利で賭けているため対数目盛で表示しています。`) +
      `投入総額 ${F.yen(K.total_staked)} に対して利益 ${F.yen(K.total_profit)}。` }));
    const h1 = el("div", { class: "chart" }); c1.appendChild(h1);
    add(c1);
    lineChart(h1, {
      points: D.equity.map(p => ({ y: p.bankroll, label: p.date.slice(2).replace(/-/g, "/"), dd: p.drawdown })),
      log: true, height: 300, color: css("--s1"), aria: "資産曲線",
      fmtY: v => v >= 1e8 ? (v / 1e8) + "億" : v >= 1e4 ? (v / 1e4).toLocaleString("ja-JP") + "万" : String(v),
      fmtEnd: v => F.yen(v),
      tip: p => `<b>${p.label}</b><br><span class="k">残高</span>${F.yen(p.y)}<br><span class="k">ドローダウン</span>${F.pct(p.dd)}`,
    });

    /* drawdown */
    const c2 = el("div", { class: "card" });
    c2.appendChild(el("h2", { text: "ドローダウン" }));
    c2.appendChild(el("div", { class: "desc", text:
      "過去最高残高からの下落率です。破産を避けるという目的においては、上の資産曲線よりこちらが本体です。" }));
    const h2 = el("div", { class: "chart" }); c2.appendChild(h2);
    add(c2);
    lineChart(h2, {
      points: D.equity.map(p => ({ y: p.drawdown, label: p.date.slice(2).replace(/-/g, "/") })),
      height: 190, color: css("--critical"), max: 0, areaBase: 0, zeroLine: 0, aria: "ドローダウン推移",
      fmtY: v => (v * 100).toFixed(0) + "%", fmtEnd: v => F.pct(v),
      tip: p => `<b>${p.label}</b><br><span class="k">ドローダウン</span>${F.pct(p.y)}`,
    });

    page("performance");
    /* what a return target costs */
    if (D.target_plan && (D.target_plan.rows || []).length) {
      const T = D.target_plan;
      const ct = el("div", { class: "card" });
      ct.appendChild(el("h2", { text: "目標と到達確率" }));
      ct.appendChild(el("div", { class: "desc", text:
        `実測 ${F.num(T.n_source_bets)} 点を再標本化して、${T.days} 開催日 × ${T.bets_per_day} 点 = ${T.n_bets} 点を` +
        `${F.num(T.rows.length ? 120000 : 0)} 回シミュレーションした結果です。` +
        "ケリー倍率を上げると平均は伸び続けますが、中央値は途中から下がります。" +
        "利益が細い確率の側に移っているからで、その差がこの表の要点です。読むべきは平均ではなく中央値と損失側です。" }));
      const facts = el("div", { class: "rules" });
      const rule2 = (k, v, d) => {
        const n = el("div", { class: "rule" });
        n.appendChild(el("div", { class: "k", text: k }));
        n.appendChild(el("div", { class: "v", text: v }));
        if (d) n.appendChild(el("div", { class: "d", text: d }));
        return n;
      };
      facts.appendChild(rule2("1点あたり期待対数成長", F.fx(T.growth_per_bet_full_kelly, 5), "フルケリーでの値"));
      facts.appendChild(rule2("フルケリーの理論上の到達点", F.fx(T.ceiling_full_kelly) + "倍",
        `${T.n_bets} 点でこれが上限`));
      facts.appendChild(rule2(`目標 ${F.fx(T.target, 1)} 倍に必要なエッジ`,
        F.fx(T.required_growth_per_bet / T.growth_per_bet_full_kelly, 1) + "倍", "現在との比"));
      facts.appendChild(rule2("現在のエッジで到達する点数", F.num(T.required_bets_at_current_edge),
        `= ${Math.round(T.required_bets_at_current_edge / T.bets_per_day)} 開催日`));
      ct.appendChild(facts);
      const tw = el("div", { class: "tw" });
      const tt = el("table");
      tt.innerHTML = "<thead><tr><th>ケリー倍率</th><th>中央値</th><th>平均</th><th>下位10%</th>" +
        `<th>P(${F.fx(T.target, 1)}倍)</th><th>P(半減)</th><th>P(9割減)</th><th>P(元本割れ)</th></tr></thead><tbody>` +
        T.rows.map(r => {
          const over = r.multiple > T.max_kelly_alpha;
          const bad = r.p_ruin > 0.02;
          return `<tr${over ? ' style="opacity:.72"' : ""}><td class="num">${F.fx(r.multiple, 2)}` +
            `${over ? ' <span class="tag blocked">上限超</span>' : ""}</td>` +
            `<td class="num" style="color:${r.median >= 1 ? "var(--good-ink)" : "var(--critical-ink)"}">${F.fx(r.median)}</td>` +
            `<td class="num">${F.fx(r.mean)}</td><td class="num">${F.fx(r.p10)}</td>` +
            `<td class="num">${F.pct(r.p_target, 2)}</td><td class="num">${F.pct(r.p_half, 2)}</td>` +
            `<td class="num" style="color:${bad ? "var(--critical-ink)" : "var(--ink-2)"}">${F.pct(r.p_ruin, 2)}</td>` +
            `<td class="num">${F.pct(r.p_down, 1)}</td></tr>`;
        }).join("") + "</tbody>";
      tt.appendChild(el("caption", { text:
        `システムの上限 α=${T.max_kelly_alpha} は 0.25 倍ケリー相当です。それを超える行は実行できません。` +
        "この表自体も合成データのエッジに基づくため、実データでエッジがゼロなら全行が下振れします。" }));
      tw.appendChild(tt); ct.appendChild(tw);
      add(ct);
    }

    /* Kelly curve: small multiples, one scale each */
    const grid = D.sweep.grid || [];
    const sel = SW.selected || {};
    const kellySub = grid.filter(g => g.ev_threshold === sel.ev_threshold && g.max_bets === sel.max_bets_per_race)
      .sort((a, b) => a.alpha - b.alpha);
    if (kellySub.length) {
      const c3 = el("div", { class: "card" });

    /* search vs holdout */

      const tw = el("div", { class: "tw" });
      const t9 = el("table");
      t9.innerHTML = "<thead><tr><th>期間</th><th>点数</th><th>投入</th><th>損益</th><th>回収率</th><th>期末残高</th><th>モデル係数 a</th><th>市場係数 b</th></tr></thead><tbody>" +
        D.periods.map(p => `<tr><td class="num">${p.start.slice(2)} 〜 ${p.end.slice(5)}</td><td class="num">${F.num(p.n_bets)}</td>` +
          `<td class="num">${F.yen(p.staked)}</td>` +
          `<td class="num" style="color:${(p.profit || 0) >= 0 ? "var(--good-ink)" : "var(--critical-ink)"}">${F.yen(p.profit)}</td>` +
          `<td class="num">${F.pct(p.recovery)}</td><td class="num">${F.yen(p.bankroll_end)}</td>` +

      tw.appendChild(t9); c9.appendChild(tw);
      add(c9);
    }

    page("model");
    /* model quality */

    cA.appendChild(el("h2", { text: "モデルの素の性能" }));
    cA.appendChild(el("div", { class: "desc", text:

    const r10 = el("div", { class: "row2" });

    rules.appendChild(rule("モデルの予測 1 位", F.pct(M.top1_hit_rate), "の確率で 1 着"));
    rules.appendChild(rule("1 番人気", F.pct(M.favourite_hit_rate), "の確率で 1 着"));
    rules.appendChild(rule("上位 3 頭に勝ち馬", F.pct(M.top3_contains_winner), "が含まれる"));

    rm.appendChild(rules); r10.appendChild(rm);

    add(cA);
    const ll = M.logloss || {};
    barChart(hA, {

      cAb.appendChild(el("div", { class: "legend", html:

      const rowsA = D.ablation.filter(r => !r.is_baseline);

        "判定は差がシード分散の 2 倍を超えるかどうか。1 つのホールドアウト期間での測定なので、" +
        "family の削除を決める前に複数ウィンドウでの再測定が要る (ロードマップ V4)。" }));
      tw.appendChild(tA); cAb.appendChild(tw);
      add(cAb);
    }

    /* guard rails */
    const cB = el("div", { class: "card" });
    cB.appendChild(el("h2", { text: "効いている安全装置" }));
    cB.appendChild(el("div", { class: "desc", text: "以下はコードにハードコードされた上限で、設定で緩めることはできません。" }));
    const rb = el("div", { class: "rules six" });
    rb.appendChild(rule("ケリー係数 α", String(P.alpha), `フル・ケリーの ${F.pct(P.alpha, 0)} まで。上限 0.25 を超えると例外`));
    rb.appendChild(rule("期待値の閾値", "≥ " + F.fx(P.ev_threshold), "これを下回る馬には 1 円も賭けない"));
    rb.appendChild(rule("1 点あたり上限", F.pct(P.max_single_fraction, 0), "資金に対する比率"));
    rb.appendChild(rule("1 レース上限", F.pct(P.max_race_exposure, 0), "同一レースの合計投入額"));
    rb.appendChild(rule("最低勝率", F.pct(P.min_prob, 0), "これ未満の大穴は対象外"));
    rb.appendChild(rule("実際の平均投入率", F.pct(K.avg_stake_fraction, 2), "上限にはほとんど触れていない"));
    cB.appendChild(rb);
    add(cB);

    page("overview");
    /* footer */
    const ft = el("footer");
    ft.appendChild(el("div", { html:
      `データ: ${D.dataset.source === "SyntheticSource" ? "合成データ" : D.dataset.source} / ` +
      `${F.num(D.dataset.n_races)} レース・${F.num(D.dataset.n_rows)} 出走・特徴量 ${D.dataset.n_features} 本 ` +
      `(${D.dataset.date_min} 〜 ${D.dataset.date_max})` }));
    ft.appendChild(el("pre", { text:
      "python src/data/preprocess.py --input raw_data/ --output processed/\n" +
      "python src/models/train_lgbm.py --data processed/train.csv --model_dir artifacts/\n" +
      "python src/backtest/simulator.py --start_date 2022-01-01 --end_date 2023-12-31\n" +
      "python src/backtest/sweep.py --start_date 2021-01-01 --end_date 2023-12-31 --holdout_start 2023-04-01\n" +
      "python src/web/export_dashboard.py --output web/data.json" }));
    ft.appendChild(el("div", { text: "このページは backtest_results/ と artifacts/ の出力から自動生成されています。" }));
    add(ft);

    mountShell(app, D, buckets, head);
  }

  /* ---------- shell: app bar, drawer, hash router ---------- */
  const ICONS = {
    overview: 'M3 12h4l3 7 4-16 3 9h4',
    today: 'M4 5h12v12H4zM4 9h12M8 3v3M12 3v3',
    performance: 'M4 16V9M9 16V4M14 16v-5M3.5 18h13',
    model: 'M10 3v4M10 13v4M3 10h4M13 10h4M10 10m-3 0a3 3 0 106 0 3 3 0 10-6 0',
    roadmap: 'M4 5h9M4 10h12M4 15h6M16.5 13.5l1.5 1.5-3 3-2-.5.5-2z',
  };
  const icon = (k) => `<svg class="ic" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" ` +
    `stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICONS[k] || ICONS.overview}"/></svg>`;

  function mountShell(app, D, buckets, overviewHead) {
    const tasks = (D.roadmap && D.roadmap.tasks) || [];
    const openTasks = tasks.filter(t => t.status !== "done").length;
    const PAGES = [
      { id: "overview", label: "概要", title: "概要",
        lead: "直近のバックテストの結果と、そこから読み取れることの要約です。" },
      { id: "today", label: "本日の予想", title: "本日の予想",
        lead: "当日の出走表に対するモデルの確率と、期待値が閾値を超えた馬への推奨購入額です。ローカル API から取得します。" },
      { id: "performance", label: "成績の内訳", title: "成績の内訳",
        lead: "賭け方のパラメータ感度、期間別・オッズ帯別の成績、探索期間とホールドアウトの差です。" },
      { id: "model", label: "モデルの中身", title: "モデルの中身",
        lead: "予測そのものの精度、確率の較正、特徴量ごとの寄与、効いている安全装置です。" },
      { id: "roadmap", label: "改善ロードマップ", title: "改善ロードマップ", count: openTasks,
        lead: "精度を上げるために積んであるタスクを、優先度順に並べています。" },
    ];

    app.innerHTML = "";
    const bar = el("div", { class: "appbar" });
    const burger = el("button", { class: "iconbtn", type: "button", "aria-label": "ページを開く",
      "aria-expanded": "false", html:
      '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" ' +
      'stroke-linecap="round" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14"/></svg>' });
    bar.appendChild(burger);
    bar.appendChild(el("span", { class: "name", text: "EquineAlpha" }));
    bar.appendChild(el("span", { class: "sep" }));
    const crumb = el("span", { class: "page", text: "" });
    bar.appendChild(crumb);
    bar.appendChild(el("span", { class: "spacer" }));
    const themeBtn = el("button", { class: "iconbtn", type: "button", "aria-label": "テーマ切替", html:
      '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" ' +
      'aria-hidden="true"><path d="M16 11.4A6.6 6.6 0 018.6 4a6.6 6.6 0 100 13.2 6.6 6.6 0 007.4-5.8z"/></svg>' });
    themeBtn.addEventListener("click", () => {
      const cur = document.documentElement.getAttribute("data-theme");
      const dark = cur ? cur === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
      try { localStorage.setItem("ea.theme", dark ? "light" : "dark"); } catch (e) { /* private window */ }
      window.dispatchEvent(new Event("resize"));
    });
    bar.appendChild(themeBtn);
    app.appendChild(bar);

    const drawer = document.getElementById("drawer");
    const backdrop = document.getElementById("backdrop");
    drawer.innerHTML = "";
    drawer.hidden = false;
    backdrop.hidden = false;
    const dh = el("div", { class: "head" });
    dh.appendChild(el("div", { class: "t", text: "EquineAlpha" }));
    dh.appendChild(el("div", { class: "s", text: D.is_synthetic ? "合成データによるデモ" : "実データ" }));
    drawer.appendChild(dh);
    const nav = el("nav");
    const navBtns = {};
    PAGES.forEach(pg => {
      const b = el("button", { class: "navitem", type: "button", html: icon(pg.id) });
      b.appendChild(el("span", { text: pg.label }));
      if (pg.count) b.appendChild(el("span", { class: "cnt", text: String(pg.count) }));
      b.addEventListener("click", () => { location.hash = "#" + pg.id; closeDrawer(); });
      nav.appendChild(b);
      navBtns[pg.id] = b;
    });
    drawer.appendChild(nav);
    drawer.appendChild(el("div", { class: "foot", text: `生成 ${D.generated_at}` }));

    const openDrawer = () => {
      drawer.classList.add("open"); backdrop.classList.add("open");
      burger.setAttribute("aria-expanded", "true");
      (nav.querySelector('[aria-current="page"]') || nav.firstElementChild).focus();
    };
    const closeDrawer = () => {
      drawer.classList.remove("open"); backdrop.classList.remove("open");
      burger.setAttribute("aria-expanded", "false");
    };
    burger.addEventListener("click", () => (drawer.classList.contains("open") ? closeDrawer() : openDrawer()));
    backdrop.addEventListener("click", closeDrawer);
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });

    const main = el("div");
    PAGES.forEach(pg => {
      const sec = el("div", { class: "page-body", id: "page-" + pg.id });
      sec.hidden = true;
      const ph = el("div", { class: "pagehead" });
      if (pg.id === "overview" && overviewHead) {
        sec.appendChild(overviewHead);
      } else {
        ph.appendChild(el("h1", { text: pg.title }));
        ph.appendChild(el("p", { text: pg.lead }));
        sec.appendChild(ph);
      }
      sec.appendChild(buckets[pg.id]);
      main.appendChild(sec);
    });
    app.appendChild(main);

    function show(id) {
      const pg = PAGES.find(x => x.id === id) || PAGES[0];
      PAGES.forEach(x => { document.getElementById("page-" + x.id).hidden = x.id !== pg.id; });
      Object.entries(navBtns).forEach(([k, b]) =>
        (k === pg.id ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current")));
      crumb.textContent = pg.title;
      document.title = "EquineAlpha";
      try { localStorage.setItem("ea.page", pg.id); } catch (e) { /* private window */ }
      window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
      window.dispatchEvent(new Event("resize"));   // charts built while hidden measure zero
      if (pg.id === "today") loadLive();
    }
    window.addEventListener("hashchange", () => show(location.hash.replace("#", "")));
    let startPage = location.hash.replace("#", "");
    if (!startPage) { try { startPage = localStorage.getItem("ea.page") || ""; } catch (e) { startPage = ""; } }
    show(PAGES.some(x => x.id === startPage) ? startPage : "overview");
  }

  /* ---------- boot ---------- */
  try {
    const saved = localStorage.getItem("ea.theme");
    if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
  } catch (e) { /* private window or blocked storage */ }

  const inline = document.getElementById("dashboard-data");
  const start = (D) => {
    try { build(D); }
    catch (e) {
      document.getElementById("app").innerHTML =
        '<div class="loading">ダッシュボードの描画に失敗しました: ' + (e && e.message ? e.message : e) + "</div>";
      throw e;
    }
  };
  if (inline && inline.textContent.trim().charAt(0) === "{") {
    start(JSON.parse(inline.textContent));
  } else {
    fetch("./data.json").then(r => {
      if (!r.ok) throw new Error("data.json が読み込めません (" + r.status + ")");
      return r.json();
    }).then(start).catch(err => {
      document.getElementById("app").innerHTML =
        '<div class="loading">データを読み込めませんでした。<br><code>python src/web/export_dashboard.py</code> を実行してください。<br><small>' + err.message + "</small></div>";
    });
  }
})();
</script>
