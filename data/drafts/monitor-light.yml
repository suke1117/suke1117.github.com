# ─────────────────────────────────────────────
# 1本目「モニターライト」の下書き
#
# ビルドはこのファイルを読みません（data/comparisons.yml だけを読みます）。
# 商品が決まったら items / table_columns を埋めて、comparisons.yml に移します。
#
# ここに書いてあるのは、商品が何であっても変わらない部分です。
#   ・scene       読者が困っている場面
#   ・not_for     先に外す人
#   ・criteria    選ぶ基準3つ（すべて数値で比べられるもの）
#   ・complaints  このジャンルで繰り返し出る不満と、その対処
#   ・first_steps 買ったあと最初にやること
#
# 集めたレビューを読んで、complaints は必ず実際の傾向に合わせて直してください。
# 下の3つは一般的に多いものです。当てはまらなければ差し替えます。
# ─────────────────────────────────────────────

- slug: "monitor-light"
  title: "モニターライトの比較｜取り付けられるかは『上枠の厚み』で決まる"
  keyword: "モニターライト 映り込み"
  category: "デスク環境"
  updated: ""          # 公開日を入れる

  scene: |
    夜、部屋の照明を落として作業していると、手元だけが暗くて目が疲れる。
    かといって普通のデスクライトを置くと画面に光が映り込むし、机も狭くなる。
    そこでモニターライトを調べ始めたものの、自分のモニターに付くのかが分からない。

    この記事は、その「付くのか分からない」を先に解決するために書いています。

  not_for:
    - "曲面モニターを使っている人（接地が2点になり、製品によっては安定しません）"
    - "モニターアームで画面をよく動かす人（上に載せる方式は重心が変わります）"
    - "部屋全体を明るくしたい人（それはシーリングライトの役割です）"

  criteria:
    - name: "対応するモニター上枠の厚み（mm）"
      why: "このジャンルで返品にいちばん多くつながるのがここ。明るさや色より先に確認する。"
      check: "モニターの上枠を定規で測る。背面が傾斜している機種は、傾斜の角度も見ておく。"
    - name: "色温度の調整範囲（K）"
      why: "目の疲れは明るさより色温度で変わることが多い。部屋の照明と揃えられるかが効く。"
      check: "2700K前後の電球色まで下げられるか。上限だけ高くても夜の作業には使わない。"
    - name: "明るさ（lx）と、その測定距離"
      why: "同じlx表記でも測定距離が違うと意味が変わる。数字だけの比較は当てにならない。"
      check: "「照射距離◯cmで◯lx」の形で書かれているか。距離の記載がない製品は割り引いて見る。"

  # 上の criteria に対応させる。specs のキーと完全に一致させること
  table_columns: ["対応厚み", "色温度", "明るさ"]

  # ▼ ここを埋める（商品が決まってから）
  items: []
  #  - slug: ""
  #    for_whom: ""
  #    not_for_whom: ""
  #    comment: ""

  # ▼ 集めた★1〜2のレビューを読んで、実際の傾向に差し替える
  complaints:
    - complaint: "自分のモニターに取り付けられなかった"
      fix: "上枠の厚みだけでなく、背面の傾斜も確認する。傾斜がきつい機種は、対応厚みの範囲内でも安定しないことがある。"
    - complaint: "結局、画面に光が映り込む"
      fix: "設置位置が手前すぎることが多い。ライトを奥に寄せ、照射角度を手前に倒すと映り込みが減る。"
    - complaint: "思っていたより暗い"
      fix: "lx は測定距離で変わる。机までの距離が製品の想定より遠い場合は、表記どおりの明るさにならない。"

  situations: []
  #  - situation: ""
  #    slug: ""
  #    reason: ""

  first_steps:
    - "色温度を下げて、部屋の照明の色と揃える（明るさより先にここを合わせる）"
    - "モニター側の画面輝度を下げ直す（周囲が明るくなった分、画面が明るすぎになります）"
    - "キーボードに手の影が落ちないか確認し、落ちるならライトを1〜2cm奥に寄せる"

  closing: |
    このジャンルは、明るさや色より先に「自分のモニターに付くか」で決まります。
    上枠の厚みさえ測っておけば、大きく外すことは少ないカテゴリです。

  related: []          # 2本目（モニター台）を書いたら STEP4 のプロンプトでつなぐ
