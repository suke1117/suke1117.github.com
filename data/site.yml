# ─────────────────────────────────────────────
# サイト全体の設定
# ─────────────────────────────────────────────

title: "えらび手帳"
tagline: "買う前の5分で、失敗を減らす。"
description: "買う前に迷いやすいものを、仕様と購入者レビューをもとに比べて記録しています。実際に使ったものは、そう明記しています。"
author: "suke1117"
lang: "ja"

# 公開URL（末尾スラッシュなし）
# ⚠ このリポジトリ名は `suke1117.github.com` なので GitHub Pages の
#   「ユーザーサイト」にはなりません（ユーザーサイトは `suke1117.github.io` という名前が必須）。
#   現状はプロジェクトページとして下記URLで公開されます。
#   ユーザーサイトにしたい場合はリポジトリ名を suke1117.github.io に変更し、
#   base_url を "https://suke1117.github.io" / base_path を "" にしてください。
base_url: "https://suke1117.github.io"
base_path: "/suke1117.github.com"

# ─────────────────────────────────────────────
# Amazon アソシエイト
# ─────────────────────────────────────────────
amazon:
  # 審査通過後に発行されるトラッキングID（例: suke1117-22）を入れる。
  # 空のままだと素のAmazonリンク（タグなし）が出力される＝審査申請中でも安全に運用できる。
  associate_tag: ""
  marketplace: "www.amazon.co.jp"

# 表示・法令まわり（ステマ規制対応のため必ず表示する）
disclosure:
  short: "本ページはプロモーションを含みます"
  long: "当サイトは Amazon.co.jp アソシエイト・プログラムの参加を予定／参加しているサイトです。記事内の商品リンクを経由して購入された場合、当サイトに紹介料が発生することがあります。"

# 価格の扱い
# PA-API 利用時、価格の表示は取得から24時間以内という規約があるため、
# 手動運用中は「金額そのもの」ではなく価格帯(price_range)を出す運用を推奨。
price_display: "range"   # range | exact | none

nav:
  - { title: "ホーム", path: "/" }
  - { title: "比較記事", path: "/compare/" }
  - { title: "読み物", path: "/posts/" }
  - { title: "このサイトについて", path: "/about/" }
