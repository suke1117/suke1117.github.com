# ─────────────────────────────────────────────
# 比較記事の定義
#
# 記事の構成は「本文を自由に書く」のではなく、
# 8つのセクションに分解して構造化データで持つ。
#
#   1. scene       ── 読者がいま困っている場面
#   2. not_for     ── この記事が向いていない人（先に外す）
#   3. criteria    ── 選ぶときに見るべき基準3つ  ※ここにリンクは絶対に置かない
#   4. 比較表       ── table_columns × products.yml の specs から自動生成
#   5. items       ── 商品ごとの解説（向いている人／向いていない人）＋リンク
#   6. complaints  ── レビューで多かった不満と、その対処
#   7. situations  ── 状況別のおすすめ ＋リンク再掲
#   8. first_steps ── 買ったあと、最初にやること
#   ＋ basis       ── 何をもとに比べたか（実機未使用ならここで明示する）
#   ＋ related     ── 記事どうしの回遊
#
# 中身は docs/prompts/02-comparison-article.md のプロンプトで生成できる。
#
# ⚠ 現在の内容は雛形です。実際のレビューを読んで
#   complaints と items を差し替えてから公開してください。
# ─────────────────────────────────────────────

- slug: "cat-water-fountain"
  title: "猫の自動給水器の比較｜手入れの差は「分解する部品の数」で決まる"
  keyword: "自動給水器 猫 手入れ"
  category: "ペット用品"
  updated: "2026-08-24"

  basis: |
    この記事の4商品は、いずれも実機を購入していません。
    メーカー公開の仕様表と、Amazonの購入者レビュー（★1〜2を中心に確認）をもとに、
    分解部品の数・年間のフィルター代・動作音の表記の3点で比べています。

    猫が実際に飲むかどうか、水の味や匂いの変化は評価していません。
    そこは実際に置いてみないと分からないためです。

  scene: |
    毎日の水替えが面倒で自動給水器を買ったのに、今度は給水器の掃除が増えた。
    ポンプの音も、静かな部屋だと思ったより気になる。

    「どれも似たような形なのに、なぜ手入れの評価がこれだけ割れるのか」
    という状態で調べている人向けの記事です。

  not_for:
    - "多頭飼いで1日2L以上飲む家庭（この価格帯の容量では足りません）"
    - "3日以上の留守を想定している人（電源と衛生の両面で、別の準備が必要です）"
    - "コードをかじる癖がある子と暮らしている人（コード保護の有無が最優先になります）"
    - "健康効果を期待して探している人（この記事では扱いません。獣医師に相談してください）"

  criteria:
    - name: "分解して洗える部品の数（点）"
      why: "「掃除が面倒」という不満は、洗う部品の数にほぼ比例する。3点と5点では毎週の手間が違う。"
      check: "商品ページの分解図か、取扱説明書PDFで数える。記載がない製品はレビューの写真を見る。"
    - name: "フィルターの交換頻度と年間コスト（円）"
      why: "本体価格より、2年目以降はこちらが効いてくる。フィルター不要の機種もある。"
      check: "「交換用フィルター」の価格 ÷ 入数 × 年間の交換回数で計算する。3,000〜5,000円/年が目安。"
    - name: "動作音（dB）と、水位が下がったときの挙動"
      why: "dBの表記は満水時の値。実際に「うるさくなった」と言われるのは水位が下がったときが大半。"
      check: "仕様のdBを見たうえで、レビューで「水位」「音が大きく」を検索して傾向を確認する。"

  table_columns: ["分解部品", "フィルター", "動作音"]

  items:
    - slug: "fountain-filterless-18l"
      for_whom: "フィルターの買い足しを続けたくない人／1匹飼いの人"
      not_for_whom: "多頭飼いの人／初期費用を抑えたい人"
      comment: "分解部品3点でフィルター不要。手入れの手間と年間コストの両方で有利だが、本体価格と容量が弱点。"
    - slug: "fountain-ceramic-25l"
      for_whom: "洗う頻度を減らしたい人／樹脂の匂いが気になる人"
      not_for_whom: "毎週シンクまで運ぶのが負担になる人（本体が重い）"
      comment: "容量2.5Lで補充が楽。重さと、フィルターが専用品である点をどう見るか。"
    - slug: "fountain-quiet-15l"
      for_whom: "ワンルームや寝室に置く人／1匹飼いの人"
      not_for_whom: "補充の回数を減らしたい人"
      comment: "dB表記は最も低いが、容量1.5Lで水位が下がりやすい。音の面ではそこが効いてくる。"
    - slug: "fountain-stainless-2l"
      for_whom: "毎週しっかり洗う前提で、本体は軽いほうがいい人"
      not_for_whom: "手入れの手間を減らすことが第一の人"
      comment: "「ステンレス製」でもタンクは樹脂の場合がある。どの部分がステンレスかを確認すること。"

  complaints:
    - complaint: "1か月ほどでポンプの音が大きくなった"
      fix: "吸水口に毛が詰まっているケースが多い。2週間ごとにポンプを分解して洗う運用にすると、音の変化は起きにくくなる。分解できないポンプの機種は避ける。"
    - complaint: "フィルター代が本体価格を超えた"
      fix: "購入前に「交換用フィルターの価格 ÷ 入数 × 年間交換回数」を計算する。年3,000〜5,000円が目安で、2年使うなら本体価格と同等になる。フィルター不要の機種と比べること。"
    - complaint: "猫が近寄らず、結局使わなくなった"
      fix: "設置場所の問題であることが多い。トイレの近く、フード皿の真横、通路の途中は避けられやすい。1週間は元の水入れも併用して、移行の様子を見る。"
    - complaint: "分解して洗ったら、元に戻せなくなった"
      fix: "分解する前に、スマホで各工程を撮っておく。部品点数が5点以上の機種はここでつまずく報告が増える。"

  situations:
    - situation: "手入れの手間をとにかく減らしたい"
      slug: "fountain-filterless-18l"
      reason: "分解部品が3点と最も少なく、フィルターの交換も発生しない。"
    - situation: "寝室に置くので、音がいちばん気になる"
      slug: "fountain-quiet-15l"
      reason: "動作音の表記が最も低い。ただし容量が小さいので、水位を保つ補充は必要。"
    - situation: "補充の回数を減らしたい／樹脂の匂いが気になる"
      slug: "fountain-ceramic-25l"
      reason: "容量2.5Lで数日もつ。重さを許容できるならこの選択。"

  first_steps:
    - "最初の1週間は元の水入れも併用して、どちらから飲むかを見る"
    - "設置してすぐ、1度分解して元に戻せることを確認しておく"
    - "交換用フィルターの型番と価格を控えて、年間コストを計算しておく"
    - "トイレとフード皿から離れた場所に置き直す（近いと使われにくい）"

  closing: |
    このジャンルは、見た目や「猫が飲むか」よりも先に、
    自分が毎週洗い続けられる構造かどうかで決まります。

    分解部品の数だけは仕様表で確認できるので、そこを外さなければ大きく失敗しにくいカテゴリです。

  related:
    - slug: "cat-auto-feeder"
      next_trouble: "水を任せられたら、次に気になるのは留守中の食事"
      lead: "留守番の時間が長い日があるなら、給餌のほうが失敗の影響が大きい話になります。"

- slug: "cat-auto-feeder"
  title: "猫の自動給餌器の比較｜停電したときに何が起きるかで選ぶ"
  keyword: "自動給餌器 猫 停電"
  category: "ペット用品"
  updated: "2026-08-24"

  basis: |
    この記事の3商品は、いずれも実機を購入していません。
    メーカー公開の仕様表と、Amazonの購入者レビュー（★1〜2を中心に確認）をもとに、
    停電時のバックアップ・最小給餌量・分解洗浄の範囲の3点で比べています。

    フードの詰まりやすさは、使うフードの粒径によって変わるため評価していません。
    かわりに、確認のしかたを本文に書いています。

  scene: |
    留守にする日の食事を任せたいけれど、詰まったり止まったりしたときが怖い。
    調べるほど「動かなかった」というレビューが出てきて、決めきれない。

    この記事は、その不安のうち**仕様で防げる部分**を先に切り分けるために書いています。

  not_for:
    - "ウェットフードを与えている人（この価格帯は乾燥フード専用がほとんどです）"
    - "1日以上の留守が想定されない人（回数を分けたいだけなら小容量で足ります）"
    - "多頭飼いで、個体ごとに食事量を変えている人（個体識別できる機種は別の価格帯です）"

  criteria:
    - name: "停電時のバックアップ（電池の有無と持続日数）"
      why: "「留守中に止まっていた」は、仕様で防げる数少ない失敗。ここだけは妥協しない。"
      check: "電池の種類・本数・持続日数の記載を見る。記載がない製品はバックアップなしとして扱う。"
    - name: "1回あたりの最小給餌量（g）"
      why: "回数を分けるほど1回の量は少なくなる。最小単位が大きいと、細かく分けられない。"
      check: "1日の総量 ÷ 分けたい回数 が、最小単位以上になるか計算する。"
    - name: "分解して洗える範囲（タンクのみか、排出口まで可か）"
      why: "詰まりと衛生の両方が、洗える範囲に関係する。排出口が洗えないと油分が残る。"
      check: "「分解洗浄可」の記載がどの部品を指すかを確認する。タンクだけの製品が多い。"

  table_columns: ["容量", "停電対策", "最小給餌量"]

  items:
    - slug: "feeder-battery-3l"
      for_whom: "1泊以上の留守がある人／停電時のリスクを減らしたい人"
      not_for_whom: "置き場所が限られている人（本体が大きい）"
      comment: "電池で約7日という記載が、このジャンルでは最も長い部類。留守番用ならここが基準になる。"
    - slug: "feeder-camera-4l"
      for_whom: "見守りカメラも検討していて、置き場所を1つにまとめたい人"
      not_for_whom: "月額課金を避けたい人／停電対策を最優先する人"
      comment: "一体型の利点はあるが、月額の有無と停電対策の欠如をどう見るかで評価が割れる。"
    - slug: "feeder-small-1l"
      for_whom: "在宅が多く、1日の給餌回数を分けたいだけの人"
      not_for_whom: "留守番用として使いたい人"
      comment: "留守番用ではなく回数分け用と割り切ると、容量1Lは欠点にならない。"

  complaints:
    - complaint: "留守中に停電して、給餌が止まっていた"
      fix: "電池バックアップの有無と持続日数を仕様で確認する。記載がない製品はバックアップなしとして扱う。電池は別売のことが多く、入れっぱなしの液漏れ報告もあるため半年ごとに交換する。"
    - complaint: "フードが詰まって出てこなかった"
      fix: "フードの粒径と、製品の対応粒径が合っていないケースが多い。手持ちのフードの粒を実測して、対応範囲の記載と照らす。大粒のフードは対応品が限られる。"
    - complaint: "排出口が洗えず、油分が残って匂う"
      fix: "「分解洗浄可」がタンクのみを指す製品が多い。排出口まで分解できるかを購入前に確認する。できない機種は、月1回のアルコール拭きを前提にする。"
    - complaint: "設定した量より多く（少なく）出てくる"
      fix: "最初の1週間は、出てきた量を毎回はかりで測って記録する。誤差の傾向が分かれば設定で補正できる。フードの粒径が変わると誤差も変わる。"

  situations:
    - situation: "1泊以上の留守がある"
      slug: "feeder-battery-3l"
      reason: "電池で約7日という記載が最も長い。留守番用ならここを基準にする。"
    - situation: "食べたかどうかを外から確認したい"
      slug: "feeder-camera-4l"
      reason: "カメラ一体型。ただし月額課金の有無を購入前に確認すること。"
    - situation: "在宅が多く、回数を分けたいだけ"
      slug: "feeder-small-1l"
      reason: "容量1Lで十分。置き場所も取らず、価格も抑えられる。"

  first_steps:
    - "手持ちのフードの粒を測り、対応粒径の記載と合っているか確認する"
    - "電池を入れて、コンセントを抜いた状態で1回動作するかを試す"
    - "最初の1週間は、出てきた量をはかりで測って誤差を記録する"
    - "排出口まで分解できるかを確認し、洗える範囲を把握しておく"

  closing: |
    このジャンルの失敗は「詰まった」と「止まっていた」の2つにほぼ集約されます。

    前者はフードの粒径、後者は電池バックアップで、どちらも購入前に仕様で確認できます。
    そこさえ押さえれば、あとは容量と置き場所の問題になります。

  related:
    - slug: "cat-water-fountain"
      next_trouble: "食事を任せられたら、同じ理屈で水も気になってくる"
      lead: "給水器も手入れの手間で評価が割れます。分解部品の数で比べた記事はこちらです。"
