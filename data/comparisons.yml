# ─────────────────────────────────────────────
# 比較記事の定義
#
# 記事の構成は「本文を自由に書く」のではなく、
# 8つのセクションに分解して構造化データで持つ。
#
#   1. scene       ── 読者がいま困っている場面
#   2. not_for     ── この記事が向いていない人（先に外す）
#   3. criteria    ── 選ぶときに見るべき基準3つ  ※ここにリンクは絶対に置かない
#   4. 比較表       ── table_columns × products.yml の specs から自動生成
#   5. items       ── 商品ごとの解説（向いている人／向いていない人）＋リンク
#   6. complaints  ── レビューで多かった不満と、その対処
#   7. situations  ── 状況別のおすすめ ＋リンク再掲
#   8. first_steps ── 買ったあと、最初にやること
#   ＋ related     ── 記事どうしの回遊
#
# こうしておくと、リンクを置く位置がテンプレート側で固定されるので、
# 記事ごとに配置がブレない。
#
# 中身は docs/prompts/02-comparison-article.md のプロンプトで生成できる。
# ─────────────────────────────────────────────

- slug: "desk-chair-cushion"
  title: "デスクチェア用クッションの比較｜厚みで選ぶと失敗しにくい"
  keyword: "腰痛 クッション 椅子"
  category: "デスク環境"
  updated: "2026-08-23"

  scene: |
    夕方になると腰の同じ場所が重くなって、座り直す回数が増える。
    椅子を買い替えるほどではないけれど、このまま毎日続くのはつらい。
    そんな状態で「腰痛 クッション 椅子」と検索している人向けの記事です。

  not_for:
    - "近いうちに椅子そのものを買い替える予定がある人（クッションは応急処置になります）"
    - "痛みが強く、長く続いている人（まず整形外科で診てもらってください）"
    - "座面が最初から低い椅子を使っていて、高さを上げたくない人"

  criteria:
    - name: "厚み（3.5cm / 5cm / 8cm）"
      why: "クッション性と、座面が何cm高くなるかは表裏一体。厚いほど効くが、机との高さが崩れる。"
      check: "机の天板下と、いま座ったときの太ももの隙間を測る。余裕が3cm未満なら厚手は避ける。"
    - name: "素材（高反発 / 低反発 / ハニカム）"
      why: "沈み込み方と、夏場の蒸れやすさが変わる。何を解決したいかで正解が変わる。"
      check: "長時間の底付きが不満なら低反発、蒸れが不満ならハニカム、姿勢の崩れなら高反発。"
    - name: "洗えるかどうか"
      why: "毎日使うものなので、半年後の衛生状態が体感に直結する。"
      check: "「カバーが洗える」か「本体ごと洗える」かは別物。商品ページの表記を確認する。"

  # 比較表の列。products.yml の specs のキーと一致させる
  table_columns: ["厚み", "素材", "カバー", "重量", "形状"]

  items:
    - slug: "cushion-a-highrebound"
      for_whom: "座面高を変えたくない人／まず安く試したい人"
      not_for_whom: "1日中座っていて、底付き感が主な不満の人"
      comment: "厚み5cmは中間。迷ったらここから始めると、外したときの損失が小さい。"
    - slug: "cushion-b-ushape"
      for_whom: "1日6時間以上座る人／尾てい骨が当たる人"
      not_for_whom: "机と椅子の高さに余裕がない人"
      comment: "効きは強いが、座面が3cm上がる前提で机の高さを見ておくこと。"
    - slug: "cushion-c-slim"
      for_whom: "夏場の蒸れがいちばんの不満だった人"
      not_for_whom: "クッション性そのものを求めている人"
      comment: "腰痛対策として買うと期待外れになりやすい。目的が蒸れなら評価が変わる。"

  complaints:
    - complaint: "半年ほどでへたって、効果を感じなくなった"
      fix: "ウレタン系は消耗品と考える。密度の記載がある製品を選び、1年ごとの買い替え前提で予算を組む。"
    - complaint: "座面が高くなって、机に対して肘が浮くようになった"
      fix: "厚手を選ぶ前に、机の天板下から座面までの高さを測る。差が3cm未満なら薄型を選ぶ。"
    - complaint: "夏に蒸れて、逆に座っていられない"
      fix: "通気を優先するならハニカム系。ウレタン系を使うなら通気性のあるカバーを別途かける。"

  situations:
    - situation: "まず3,000円台で試したい"
      slug: "cushion-a-highrebound"
      reason: "厚みが中間で、机との相性を崩しにくい。合わなかったときの損失も小さい。"
    - situation: "1日6時間以上座っていて、底付き感がつらい"
      slug: "cushion-b-ushape"
      reason: "厚みがあり、長時間でも沈み切りにくい。座面高の余裕がある人向け。"
    - situation: "夏場の蒸れがいちばんの不満"
      slug: "cushion-c-slim"
      reason: "通気性を優先した構造。クッション性より涼しさを取る選択。"

  first_steps:
    - "机の天板下から座面までの高さを測り直す（クッションを敷いた状態で）"
    - "モニターの高さを、目線の高さに合わせ直す（座面が上がった分ずれています）"
    - "カバーを1度洗って、洗濯後の縮み具合を確認しておく"

  closing: |
    クッションは椅子の代わりにはなりません。
    ただ「椅子を買い替えるまでの数年」を楽にする道具としては、費用対効果が高い部類です。
    厚みだけ間違えなければ、大きく外すことは少ないカテゴリだと思います。

  related:
    - slug: "zaitaku-work-starter"
      next_trouble: "座る環境を整えたあと、次に気になるのは手元の明るさ"
      lead: "座り方が落ち着いたら、次は夜の作業で目が疲れる問題が残ります。順番に整えたい人はこちら。"

- slug: "zaitaku-work-starter"
  title: "在宅ワークを始めるとき、最初に買ってよかったもの"
  keyword: "在宅ワーク 環境 揃える"
  category: "デスク環境"
  updated: "2026-08-23"

  scene: |
    在宅で働く時間が増えて、家の机で長く作業するようになった。
    何から買えばいいのか分からないまま、とりあえず今の環境で我慢している。
    そんな状態の人向けに、効果を感じた順に並べています。

  not_for:
    - "すでにデスク環境を一通り揃えている人"
    - "週に1〜2日だけ在宅という人（費用対効果が出にくいです）"

  criteria:
    - name: "毎日使うかどうか"
      why: "使用回数で割ると、1回あたりの金額が変わる。毎日触るものほど予算をかける価値がある。"
      check: "週に何回使うかを先に決めてから、予算の上限を決める。"
    - name: "既存の環境を変えずに導入できるか"
      why: "机や椅子を買い替える前提のものは、導入のハードルが一気に上がる。"
      check: "設置に必要な寸法（天板の厚み、モニター上枠の奥行きなど）を測っておく。"
    - name: "消耗品かどうか"
      why: "1年で買い替えるものと、5年使うものでは、同じ価格でも意味が違う。"
      check: "ウレタン系・バッテリー内蔵品は消耗品として予算を組む。"

  table_columns: []

  items:
    - slug: "ankermake-desk-light"
      for_whom: "夜に部屋を暗くして作業することが多い人"
      not_for_whom: "モニターを使わずノートPC単体で作業する人"
      comment: "夜の作業で目の疲れ方が変わったのがこれ。効果のわりに安い。"
    - slug: "anker-soundcore-life-p3"
      for_whom: "同居人の生活音がある環境で集中したい人"
      not_for_whom: "静かな個室がすでにある人"
      comment: "生活音がある環境なら、ノイキャンの有無で集中の続き方が違う。"

  complaints:
    - complaint: "モニターライトが自分のモニターに固定できなかった"
      fix: "モニター上枠の厚みと奥行きを購入前に測る。ここを外すと固定できない。"
    - complaint: "イヤホンを長時間つけていると耳が痛くなる"
      fix: "イヤーピースのサイズを替える。付属の3サイズを1日ずつ試すと分かる。"

  situations:
    - situation: "予算1万円以内で、まず1つだけ買いたい"
      slug: "ankermake-desk-light"
      reason: "設置が簡単で、夜の作業がある人ほど体感が大きい。"
    - situation: "家族の生活音がつらい"
      slug: "anker-soundcore-life-p3"
      reason: "音の問題は他の方法で解決しにくいため、優先度が上がる。"

  first_steps:
    - "作業時間帯の部屋の明るさを、1度スマホのカメラで撮って記録しておく"
    - "1週間使ってみて、疲れ方が変わったかをメモする"

  closing: |
    椅子や机のような大物より先に「光」と「音」を整えるほうが、
    費用対効果は高いと感じています。

  related:
