# ─────────────────────────────────────────────
# 商品マスタ
#
# ここが唯一の情報源。ここに1件足せば
#   ・商品ページ         /items/<slug>/
#   ・まとめ記事への掲載   data/roundups.yml から参照
#   ・Xへの自動投稿対象
# がすべて自動で増える。
#
# PA-API のキーを取得したら
#   python scripts/fetch_products.py --refresh
# で title / image / price / features をAmazonから自動更新できる
# （手書きした review / verdict / cons は上書きされない）。
# ─────────────────────────────────────────────

- slug: "anker-soundcore-life-p3"
  asin: "B09FR56X6X"          # ← 実在ASINに差し替えること
  title: "Anker Soundcore Life P3"
  brand: "Anker"
  category: "オーディオ"
  tags: ["ワイヤレスイヤホン", "ノイズキャンセリング", "1万円以下"]
  price_range: "8,000〜10,000円"
  rating: 4.0
  image: ""                    # 空ならプレースホルダー画像。PA-API取得後に自動で入る
  summary: "1万円以下でノイキャンとマルチポイントを両立させたい人の最初の1台。"
  pros:
    - "この価格帯としてはノイズキャンセリングがしっかり効く"
    - "アプリでイコライザーを細かく追い込める"
    - "ケース込みで長時間再生"
  cons:
    - "音質重視なら上位機のほうが満足度は高い"
    - "装着感は人を選ぶ"
  best_for: "通勤・在宅ワークのながら聞きが中心の人"
  review: |
    「安いノイキャンイヤホン」として名前が挙がり続けている定番。
    完全な無音になるタイプではないが、電車の走行音やエアコンの低い唸りは
    はっきり減る。価格を考えれば十分に実用的なレベル。

    音そのものは低音寄りのチューニング。初期設定だとやや膨らむので、
    アプリのイコライザーで低域を少し削ると素直な鳴り方になる。

- slug: "fire-tv-stick-4k-max"
  asin: "B0BW2X9V4K"
  title: "Fire TV Stick 4K Max"
  brand: "Amazon"
  category: "ガジェット"
  tags: ["ストリーミング", "テレビ", "5,000円台"]
  price_range: "6,000〜8,000円"
  rating: 4.5
  image: ""
  summary: "古いテレビを一気に今どきにする、いちばん安い方法。"
  pros:
    - "動作が速く、アプリの起動待ちがほぼない"
    - "Wi-Fi 6E対応で回線が混んでも安定しやすい"
    - "セール時の値引き幅が大きい"
  cons:
    - "無印モデルとの体感差は用途によっては小さい"
    - "リモコンの操作系に慣れが必要"
  best_for: "テレビでの動画視聴が週に数回以上ある人"
  review: |
    テレビ側の機能に不満があるなら、買い替えるより先にこれを挿すほうが安い。
    無印との差は主に「もたつきの少なさ」で、毎日使うほど効いてくる。

    セール時に大きく下がる商品なので、急ぎでなければ値下がりを待つ判断もあり。

