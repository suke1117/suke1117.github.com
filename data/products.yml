    普通のデスクライトだと画面に反射するし、机も狭くなる。
    モニター上部に載せるタイプはその両方を回避できる。

    購入前にモニター上枠の厚みと奥行きだけは確認しておくこと。
    ここを外すと固定できずに詰む。
