# ─────────────────────────────────────────────
# 商品マスタ
#
# ここが唯一の情報源。ここに1件足せば
#   ・商品ページ           /items/<slug>/
#   ・比較記事への掲載      data/comparisons.yml から参照
#   ・比較表とPinterest画像  specs の値がそのまま列になる
#   ・Xへの自動投稿対象
# がすべて自動で増える。
#
# stance は必須。実機を使ったかどうかを商品ごとに宣言する。
#   owned      … 実際に使った。own_note（実際に気づいた一言）が必須
#   researched … 使っていない。evidence（何をもとに書いたか）が必須で、
#                own_note は書けない。記事には「実機未使用」と表示される
#
# PA-API のキーを取得したら
#   python scripts/fetch_products.py --refresh
# で title / image / price / features をAmazonから自動更新できる
# （手書きした review / verdict / cons は上書きされない）。
# ─────────────────────────────────────────────

- slug: "anker-soundcore-life-p3"
  asin: "B09FR56X6X"          # ← 実在ASINに差し替えること
  title: "Anker Soundcore Life P3"
  brand: "Anker"
  category: "オーディオ"
  tags: ["ワイヤレスイヤホン", "ノイズキャンセリング", "1万円以下"]
  price_range: "8,000〜10,000円"
  rating: 4.0
  image: ""                    # 空ならプレースホルダー画像。PA-API取得後に自動で入る
  summary: "1万円以下でノイキャンとマルチポイントを両立させたい人の最初の1台。"
  pros:
    - "この価格帯としてはノイズキャンセリングがしっかり効く"
    - "アプリでイコライザーを細かく追い込める"
    - "ケース込みで長時間再生"
  cons:
    - "音質重視なら上位機のほうが満足度は高い"
    - "装着感は人を選ぶ"
  best_for: "通勤・在宅ワークのながら聞きが中心の人"
  stance: "owned"
  own_note: |
    ノイキャンをオンにしても人の声は残る。
    生活音は減るが「会話が聞こえない」ほどではないので、そこは期待しすぎないこと。
  review: |
    「安いノイキャンイヤホン」として名前が挙がり続けている定番。
    完全な無音になるタイプではないが、電車の走行音やエアコンの低い唸りは
    はっきり減る。価格を考えれば十分に実用的なレベル。

    音そのものは低音寄りのチューニング。初期設定だとやや膨らむので、
    アプリのイコライザーで低域を少し削ると素直な鳴り方になる。

