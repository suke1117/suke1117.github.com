  price_range: "6,000〜8,000円"
  rating: 4.5
  image: ""
  summary: "古いテレビを一気に今どきにする、いちばん安い方法。"
  pros:
    - "動作が速く、アプリの起動待ちがほぼない"
    - "Wi-Fi 6E対応で回線が混んでも安定しやすい"
    - "セール時の値引き幅が大きい"
  cons:
    - "無印モデルとの体感差は用途によっては小さい"
    - "リモコンの操作系に慣れが必要"
