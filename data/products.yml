    テレビ側の機能に不満があるなら、買い替えるより先にこれを挿すほうが安い。
    無印との差は主に「もたつきの少なさ」で、毎日使うほど効いてくる。

    セール時に大きく下がる商品なので、急ぎでなければ値下がりを待つ判断もあり。

