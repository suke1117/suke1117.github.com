name: Threadsへの自動投稿

on:
  schedule:
    # 09:00 / 20:00 JST（UTCではその-9時間）
    # Xより投稿頻度を落としている。Threadsは1投稿あたりの中身が濃いため。
    - cron: "0 0 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "投稿せず文面だけ確認する"
        type: boolean
        default: true

permissions:
  contents: write   # 投稿履歴(data/state/threads_posted.json)をコミットするため

concurrency:
  group: post-to-threads
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 投稿
        env:
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          AMAZON_ASSOCIATE_TAG: ${{ secrets.AMAZON_ASSOCIATE_TAG }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/post_to_threads.py --dry-run
          else
            python scripts/post_to_threads.py
          fi

      - name: 投稿履歴をコミット
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state/threads_posted.json
          git diff --staged --quiet || git commit -m "chore: Threads投稿履歴を更新 [skip ci]"
          git push
